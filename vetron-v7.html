const vMax = () => isPG() ? 70 : 250;
function polarPts() {
  const w = wingNow(), k = loadK();
  const sinkTrim = (w.trim / 3.6) / w.glide;
  const vs = w.trim * 0.62, vms = w.trim * 0.86;
  return [
    [vs * k, sinkTrim * 1.75 * k],
    [(vs + 2) * k, sinkTrim * 1.26 * k],
    [vms * k, sinkTrim * 0.93 * k],
    [w.trim * k, sinkTrim * k],
    [(w.trim + w.top) / 2 * k, (sinkTrim + (w.sinkTop - sinkTrim) * 0.42) * k],
    [w.top * k, w.sinkTop * k],
    [(w.top + 8) * k, w.sinkTop * 1.5 * k]
  ];
}
function polarP(v) {
  const P = polarPts();
  if (v <= P[0][0]) return P[0][1] + (P[0][0] - v) * 0.12;
  for (let i = 1; i < P.length; i++) if (v <= P[i][0]) {
    const a = P[i - 1], b = P[i];
    return a[1] + (b[1] - a[1]) * (v - a[0]) / (b[0] - a[0]);
  }
  const last = P[P.length - 1];
  return last[1] + (v - last[0]) * 0.09;
}
const sinkRef = () => isPG() ? 0 : 0.62;   // vztažné opadání (mraky jsou kalibrované na 90 km/h větroně)
function polar(v) { const k = isPG() ? 1 : ballastK(); return isPG() ? polarP(v) : k * polarG(v / k); }

function polarInfo() {
  let best = { s: 9, v: 0 }, glide = { g: 0, v: 0 };

  for (let v = v0; v <= v1; v += 0.25) {
    const s = polar(v);
    if (s < best.s) best = { s, v };
    const g = (v / 3.6) / s;
    if (g > glide.g) glide = { g, v };
  }
  return { minSink: best.s, minSinkV: best.v, glide: glide.g, glideV: glide.v };
}

// ===== šum =====
function hash(ix, iy, s) {
  let h = (Math.imul(ix, 0x27d4eb2d) ^ Math.imul(iy, 0x165667b1) ^ Math.imul(s, 0x9e3779b1)) | 0;
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, s) {
  const ix = Math.floor(x), iy = Math.floor(y);
  let fx = x - ix, fy = y - iy;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
  const a = hash(ix, iy, s), b = hash(ix + 1, iy, s), c = hash(ix, iy + 1, s), d = hash(ix + 1, iy + 1, s);
  return (a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy) * 2 - 1;
}
function fbm(x, y, o, s) {
  let sum = 0, amp = 1, norm = 0;
  for (let i = 0; i < o; i++) { sum += vnoise(x, y, s + i * 17) * amp; norm += amp; amp *= 0.5; x *= 2.03; y *= 2.03; }

}

const CELL = 4000;
const cellKey = (cx, cy) => cx * 100000 + cy;
function makeIndex() {
  const idx = new Map();
  const put = (cx, cy, item) => {
    const k = cellKey(cx, cy);
    let a = idx.get(k); if (!a) { a = { seg: [], lake: [], city: [], af: [], site: [] }; idx.set(k, a); }
    a[item.type].push(item.v);
  };
  const addSeg = (pts, reach, data, type) => {
    for (let i = 0; i < pts.length - 1 || (pts.length === 1 && i === 0); i++) {
      const a = pts[i], b = pts[Math.min(i + 1, pts.length - 1)];
      const seg = { ax: a[0], ay: a[1], bx: b[0], by: b[1], d: data, t: type };
      const x0 = Math.min(a[0], b[0]) - reach, x1 = Math.max(a[0], b[0]) + reach;
      const y0 = Math.min(a[1], b[1]) - reach, y1 = Math.max(a[1], b[1]) + reach;
      for (let cx = Math.floor(x0 / CELL); cx <= Math.floor(x1 / CELL); cx++)
        for (let cy = Math.floor(y0 / CELL); cy <= Math.floor(y1 / CELL); cy++) put(cx, cy, { type: 'seg', v: seg });
    }
  };
  for (const r of RIVERS) addSeg(r.pts, r.w + 200, r, 'river');
  for (const r of ROADS) addSeg(r.pts, 400, r, 'road');
  for (const r of RIDGES) addSeg(r.pts, r.w * 2.6, r, 'ridge');
  const box = (x, y, rx, ry, item) => {
    for (let cx = Math.floor((x - rx) / CELL); cx <= Math.floor((x + rx) / CELL); cx++)
      for (let cy = Math.floor((y - ry) / CELL); cy <= Math.floor((y + ry) / CELL); cy++) put(cx, cy, item);
  };
  for (const l of LAKES) box(l.x, l.y, l.rx + 600, l.ry + 600, { type: 'lake', v: l });
  for (const c of CITIES) box(c.x, c.y, c.R * 1.5, c.R * 1.5, { type: 'city', v: c });
  for (const a of AIRFIELDS) box(a.x, a.y, a.len * 0.8 + 500, a.len * 0.8 + 500, { type: 'af', v: a });
  for (const t of SITES) box(t.x, t.y, 2600, 2600, { type: 'site', v: t });
  return idx;
}
const IDX = makeIndex();

function segDist(s, x, y) {
  const dx = s.bx - s.ax, dy = s.by - s.ay;
  const L2 = dx * dx + dy * dy;
  let t = L2 > 0 ? ((x - s.ax) * dx + (y - s.ay) * dy) / L2 : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  const px = s.ax + dx * t - x, py = s.ay + dy * t - y;
  return Math.sqrt(px * px + py * py);
}

// ===== makro-terén =====
function terrainElev(x, y) {
  const c = cellAt(x, y);
  let h = 225 + fbm(x / 9000, y / 9000, 3, 5) * 95;
  let peak = 0, hasRidge = false, hasRiver = false;
  for (const s of c.seg) { if (s.t === 'ridge') hasRidge = true; else if (s.t === 'river') hasRiver = true; }
  if (hasRidge) {
    // zvlněná osa hřebene → rozsochy a sedla
    const wob = fbm(x / 3000, y / 3000, 2, 45) * 320;
    for (const s of c.seg) {
      if (s.t !== 'ridge') continue;
      const d = Math.max(0, segDist(s, x, y) + wob);
      const q = d / s.d.w;
      const f = Math.exp(-q * q * 1.15) * (0.84 + 0.16 * Math.cos(q * 2.2));
      const v = s.d.h * f;
      if (v > peak) peak = v;
    }
    if (peak > h) h = h + (peak - h) * 0.95;
  }
  const rel = clamp((h - 260) / 900, 0, 1);
  // hřebenový (ridged) šum – ostré hřbety a rýhy
  const rg = 1 - Math.abs(fbm(x / 2200, y / 2200, 3, 9));
  h += (rg - 0.5) * (55 + 240 * rel);
  h += fbm(x / 800, y / 800, 2, 19) * (16 + 65 * rel);
  // údolí kolem řek
  if (hasRiver) {
    const wp = warp(x, y);
    let best = 1e9;
    for (const s of c.seg) if (s.t === 'river') { const d = segDist(s, wp[0], wp[1]); if (d < best) best = d; }
    if (best < 1500) h -= (1 - best / 1500) * (30 + 90 * rel);
  }
  // vrcholy startovaček mají skutečnou výšku a kopec pod sebou
  if (AF_FLAT) for (const t of c.site) {
    const d = Math.hypot(x - t.x, y - t.y);
    if (d < 1500) h = lerp(h, t.top - d * 0.22, clamp(1 - (d - 200) / 1300, 0, 1) * 0.8);
  }
  // letiště leží na rovině – terén se k jeho výšce plynule srovná
  if (AF_FLAT) for (const a of c.af) {
    const R = Math.max(600, a.len * 0.6);
    const d = Math.hypot(x - a.x, y - a.y);
    if (d < R * 1.8) h = lerp(h, a.elev, clamp(1 - (d - R * 0.55) / (R * 1.25), 0, 1) * 0.92);
  }
  return Math.max(120, h);
}
function lakeAt(x, y) {
  const c = cellAt(x, y);
  if (c.lake.length && c.site.length) {
    for (const t of c.site) if (Math.hypot(x - t.x, y - t.y) < 1900) return null;   // kopec se startovačkou není ve vodě
  }
  for (const l of c.lake) {
    const dx = x - l.x, dy = y - l.y, co = Math.cos(-l.rot), si = Math.sin(-l.rot);
    const u = dx * co - dy * si, v = dx * si + dy * co;
    const q = (u / l.rx) * (u / l.rx) + (v / l.ry) * (v / l.ry);
    const lim = 1 + 0.18 * fbm(x / 450, y / 450, 2, 27);
    if (q < lim) return { l, depth: clamp((lim - q) / 0.5, 0, 1) };
  }
  return null;
}

// meandry: lehké pokřivení souřadnic pro řeky a silnice
function warp(x, y) {
  return [x + fbm(x / 1500, y / 1500, 2, 121) * 300, y + fbm(x / 1500 + 9, y / 1500, 2, 123) * 300];
}
function riverDist(x0, y0) {
  const wp = warp(x0, y0), x = wp[0], y = wp[1];
  const c = cellAt(x, y);
  let best = 1e9, w = 40;
  for (const s of c.seg) {
    if (s.t !== 'river') continue;
    const d = segDist(s, x, y);
    if (d < best) { best = d; w = s.d.w; }
  }
  return { d: best, w };
}
function roadDist(x0, y0) {
  const wp = warp(x0, y0), x = wp[0], y = wp[1];
  const c = cellAt(x, y);
  let best = 1e9;
  for (const s of c.seg) { if (s.t === 'road') { const d = segDist(s, x, y); if (d < best) best = d; } }
  return best;
}
function urbanity(x, y) {
  const c = cellAt(x, y);

    const d = Math.hypot(x - t.x, y - t.y);
    if (d < R) { const v = 1 - d / R; if (v > u) { u = v; big = t.size; city = t; } }

}

function townInfo(x, y) {

  const a = (hash(Math.round(c.x / 100), Math.round(c.y / 100), 55) - 0.5) * 1.6;
  const ca = Math.cos(a), sa = Math.sin(a);
  const ux = (x - c.x) * ca + (y - c.y) * sa, vy = -(x - c.x) * sa + (y - c.y) * ca;

function afAt(x, y) {
  const c = cellAt(x, y);

    const u = dx * co + dy * si, v = -dx * si + dy * co;

function landAt(x, y) {
  if (lakeAt(x, y)) return 3;

  if (rv.d < rv.w * 0.5) return 5;

  if (fo > 0.22 - clamp((e - 300) / 1400, 0, 0.14)) return 1;

  if (LNCH.inflate > 0.85 && air > vStall() * 1.06) {
    LNCH.phase = 2;
    S.alt = S.gnd + 2.5;
    S.airborneT = 0;
    S.ctrl = -0.15; S.sym = 0.15;
    msgs.push({ t: 0, txt: 'Vzlet! Ruce nahoru a hledej stoupák', big: true });
    blip(680, 0.12);
    state = 'play';
  }
}

// =======================================================================
//  FYZIKA LETU PADÁKU
// =======================================================================
function physPG(dtR, dtS) {
  if (state === 'launch') { updateLaunch(dtR, dtS); return; }

  // ---- ovládání: brzdy zůstávají tam, kam je pilot dá ----
  const rateOn = 1.05, rateOff = 1.6;
  const tgtL = clamp(-IN.ax, 0, 1), tgtR = clamp(IN.ax, 0, 1);
  S.bl += clamp(tgtL - S.bl, -rateOff * dtR * 1.6, rateOn * dtR * 1.6);
  S.br += clamp(tgtR - S.br, -rateOff * dtR * 1.6, rateOn * dtR * 1.6);
  const tgtSym = clamp(-IN.ay, 0, 1), tgtBar = S.stall ? 0 : clamp(IN.ay, 0, 1);
  S.sym += clamp(tgtSym - S.sym, -1.3 * dtR, 0.85 * dtR);
  S.bar += clamp(tgtBar - S.bar, -2.2 * dtR, 0.7 * dtR);
  if (S.stall) S.bar = 0;
  const brakeBoth = Math.max(S.sym, Math.min(S.bl, S.br) * 0.85);
  S.ctrl = S.bar - brakeBoth;                        // -1 = zabrzděno, 0 = trim, +1 = plný plyn

  // ---- pád a přetažení ----
  if (!S.stall && brakeBoth > 0.95) { S.stallT += dtS; if (S.stallT > 3.0) { S.stall = true; S.pendV -= 90; blip(180, 0.35); msgs.push({ t: 0, txt: 'PŘETAŽENÍ! Povol brzdy (↑)', big: true }); } }
  else if (brakeBoth < 0.9) S.stallT = Math.max(0, S.stallT - dtS * 1.5);
  if (!S.stall && brakeBoth > 0.8 && brakeBoth <= 0.95 && Math.random() < dtS * 0.5 && !S.warnBrake) { S.warnBrake = 1; msgs.push({ t: 0, txt: 'brzdy hluboko – hlídej si přetažení', big: false }); }
  if (brakeBoth < 0.6) S.warnBrake = 0;
  if (S.stall && brakeBoth < 0.4) { S.stall = false; S.surge = 2.4; S.pendV += 140; msgs.push({ t: 0, txt: 'Zákmit dopředu – nechat vyletět', big: false }); }

  // ---- spirála: dlouho držená vnitřní brzda ----
  const oneSide = Math.max(S.bl, S.br) - Math.min(S.bl, S.br);
  if (!S.stall && oneSide > 0.92 && Math.abs(S.bank) > 21) {
    S.spiralT += dtS;
    if (S.spiralT > 4 && S.spiral < 0.02 && !S.warnSpiral) { S.warnSpiral = 1; msgs.push({ t: 0, txt: 'křídlo se zavrtává do spirály – povol vnitřní brzdu', big: true }); }
    if (S.spiralT > 6) S.spiral = Math.min(1, S.spiral + dtS * 0.25);
  }
  else { S.spiralT = Math.max(0, S.spiralT - dtS * 1.5); S.spiral = Math.max(0, S.spiral - dtS * 0.4); if (S.spiralT < 2) S.warnSpiral = 0; }

  // ---- náklon ----
  const hand = wingNow().handling * (S.ears ? 0.45 : 1);
  const bankMax = 22 * hand + S.spiral * 44;
  const bankTgt = S.stall ? 0 : clamp((S.br - S.bl) * 24 * hand + S.spiral * Math.sign(S.bank || 1) * 44, -bankMax, bankMax);
  S.bank += (bankTgt - S.bank) * Math.min(1, dtR * (1.6 + hand));
  if (S.collapse > 0) { S.collapse -= dtS; S.bank += 26 * S.collapseDir * dtR; }

  // ---- vzdušná rychlost ----
  const vT = vTrim(), vS = vStall(), vX = vTop();
  let vTarget = S.ctrl >= 0 ? vT + S.ctrl * (vX - vT) : vT + S.ctrl * (vT - vS - 0.4);
  if (S.ears) vTarget *= 0.92;
  if (S.stall) vTarget = vS * 0.35;
  if (S.surge > 0) vTarget = vT * 1.35;
  if (S.spiral > 0) vTarget = lerp(vTarget, vT * 2.0, S.spiral);
  vTarget *= Math.sqrt(S.n || 1);
  S.ias += clamp(vTarget - S.ias, -28 * dtS, 22 * dtS);
  const v = Math.max(1, S.ias) / 3.6;

  // ---- kyv (pendulum) pilota pod křídlem ----
  const drive = (S.ctrl - (S.ctrlPrev === undefined ? S.ctrl : S.ctrlPrev)) / Math.max(0.001, dtR);
  S.ctrlPrev = S.ctrl;
  S.pendV += (-9 * S.pend - 2.6 * S.pendV - drive * 26) * dtR;
  S.pend += S.pendV * dtR;
  S.pend = clamp(S.pend, -45, 45);
  S.pitch = -S.pend * 0.012;

  // ---- zatáčka a kurz ----
  S.n = S.stall ? 1 : 1 / Math.cos(clamp(Math.abs(S.bank), 0, 70) * DEG);
  S.vstall = stallSpeed(S.n);
  if (!S.stall) S.psi -= G * Math.tan(S.bank * DEG) / v * dtS;

  // ---- vertikální rychlost ----
  S.slope = slopeLift(S.x, S.y, S.alt);
  S.wave = waveAt(S.x, S.y, S.alt);
  const wAir = airmassAt(S.x, S.y, S.alt) + S.slope + S.wave;
  let sink;
  if (S.stall) sink = 6.5;
  else if (S.spiral > 0.02) sink = lerp(polarN(S.ias, S.n), 16, S.spiral);
  else {
    sink = polarN(S.ias, S.n);
    if (S.ears) sink += 1.3 + S.bar * 1.5;
    if (S.surge > 0) { sink += 2.2 * clamp(S.surge, 0, 1); S.surge -= dtS; }
    if (S.collapse > 0) sink += 2.4;
  }
  S.vz = wAir - sink;
  const wv2 = windAt(S.alt, S.gnd);
  const gvx = Math.cos(S.psi) * v + wv2[0], gvy = Math.sin(S.psi) * v + wv2[1];
  S.x += gvx * dtS; S.y += gvy * dtS;
  S.gs = Math.hypot(gvx, gvy) * 3.6;
  S.trk = Math.atan2(gvy, gvx);
  S.alt = Math.min(WX.base - 15 + clamp(S.wave, 0, 4) * 400, S.alt + S.vz * dtS);
  S.dist += Math.hypot(gvx, gvy) * dtS;
  S.maxAlt = Math.max(S.maxAlt, S.alt);
  S.varioD += (S.vz - S.varioD) * Math.min(1, dtS / 0.9);
  S.climbAvg += (S.vz - S.climbAvg) * Math.min(1, dtS / 25);
  S.glideNow = S.vz < -0.05 ? (S.gs / 3.6) / -S.vz : 999;

  // ---- zaklopení (asymetrický kolaps) v turbulenci s plynem ----
  if (S.collapse <= 0 && !S.stall && S.bar > 0.45) {
    const turb = Math.abs(airmassAt(S.x + Math.cos(S.psi) * 60, S.y + Math.sin(S.psi) * 60, S.alt) - airmassAt(S.x, S.y, S.alt));
    if (turb > 1.4 && Math.random() < dtS * 0.1 * (turb - 1.2)) {
      S.collapse = rand(1.6, 3.2); S.collapseDir = Math.random() < 0.5 ? -1 : 1;
      S.bar = 0;
      msgs.push({ t: 0, txt: 'ZAKLOPENÍ! Srovnej směr protibrzdou', big: true });
      blip(240, 0.25);
    }
  }
}

// =======================================================================
//  FYZIKA LETU VĚTRONĚ
// =======================================================================
function physGL(dtR, dtS) {
  if (TOW.on) { updateTow(dtR, dtS); return; }
  if (S.stall && IN.ay > 0.35) { S.stall = false; S.ias = 85; S.target = 95; blip(660, 0.08); }
  if (!S.stall) {
    S.bankCmd += (IN.ax * 45 - S.bankCmd) * Math.min(1, dtR * 3.4);
    if (Math.abs(S.bankCmd) < 0.6 && Math.abs(IN.ax) < 0.02) S.bankCmd = 0;
    S.bank += (S.bankCmd - S.bank) * Math.min(1, dtR * 6);
    if (Math.abs(IN.ay) > 0.03) S.target = clamp(S.target + IN.ay * 42 * dtR, 70, 200);
  }
  const n = S.stall ? 1 : 1 / Math.cos(clamp(Math.abs(S.bank), 0, 60) * DEG);
  S.n = n;
  S.vstall = stallSpeed(n);
  let v = S.ias / 3.6, accel = 0;
  if (S.stall) {
    S.accel = 0;
    S.stallT += dtS;
    v = 19; S.ias = 62 + Math.sin(S.stallT * 3.1) * 4;
    S.bank = Math.sin(S.stallT * 2.2) * 22; S.bankCmd = 0;
    S.psi += 0.2 * dtS;
    S.pitch = lerp(S.pitch, 0.55, Math.min(1, dtR * 4));
    S.vz = -10;
    if (S.stallT > 4) { S.stall = false; S.ias = 88; S.target = Math.max(95, S.target); }
  } else {
    accel = clamp((S.target - S.ias) / 3.6 * 0.5, -1.7, 1.7);
    S.accel = accel;
    v += accel * dtS;
    S.ias = clamp(v * 3.6, 45, 230);
    v = S.ias / 3.6;
    S.psi -= G * Math.tan(S.bank * DEG) / v * dtS;
    S.pitch = lerp(S.pitch, (S.ias - 95) / 110 * 0.14 - accel * 0.06, Math.min(1, dtR * 3));
    S.slope = slopeLift(S.x, S.y, S.alt);
    S.wave = waveAt(S.x, S.y, S.alt);
    const w = airmassAt(S.x, S.y, S.alt) + S.slope + S.wave;
    S.vz = w - polarW(S.ias, n) - v * accel / G;
    if (S.ias < S.vstall) { S.stall = true; S.stallT = 0; blip(200, 0.3); msgs.push({ t: 0, txt: 'PÁDOVÁ RYCHLOST – přidej!', big: true }); }
  }
  const wv = windAt(S.alt, S.gnd);
  const gvx = Math.cos(S.psi) * v + wv[0], gvy = Math.sin(S.psi) * v + wv[1];
  S.x += gvx * dtS; S.y += gvy * dtS;
  S.gs = Math.hypot(gvx, gvy) * 3.6;
  S.trk = Math.atan2(gvy, gvx);
  S.alt = Math.min(WX.base - 25 + clamp(S.wave, 0, 4) * 520, S.alt + S.vz * dtS);
  S.dist += Math.hypot(gvx, gvy) * dtS;
  S.maxAlt = Math.max(S.maxAlt, S.alt);
  S.varioD += (S.vz - S.varioD) * Math.min(1, dtS / 1.1);
  S.climbAvg += (S.vz - S.climbAvg) * Math.min(1, dtS / 25);
  S.glideNow = S.vz < -0.05 ? (S.gs / 3.6) / -S.vz : 999;
}
function physics(dtR, dtS) {
  S.time += dtS;
  S.gnd = terrainElev(S.x, S.y);
  if (isPG()) physPG(dtR, dtS); else physGL(dtR, dtS);
}

// =======================================================================
//  ÚLOHA (soutěžní trať)
// =======================================================================
const TASK = { type: 'free', len: 80, tps: [], dist: 0, started: false, t0: 0, idx: 0, done: false, achieved: 0, legs: [], fai: false };
function taskPoints() { return [{ x: HOME.x, y: HOME.y, name: HOME.icao }].concat(TASK.tps).concat(TASK.type === 'free' ? [] : [{ x: HOME.x, y: HOME.y, name: HOME.icao }]); }
function computeTask() {
  TASK.legs = []; TASK.dist = 0; TASK.fai = false;
  if (TASK.type === 'free' || !TASK.tps.length) return;
  const pts = taskPoints();
  for (let i = 0; i < pts.length - 1; i++) {
    const d = Math.hypot(pts[i + 1].x - pts[i].x, pts[i + 1].y - pts[i].y);
    TASK.legs.push(d); TASK.dist += d;
  }
  if (TASK.type === 'tri' && TASK.legs.length === 3) {
    const mn = Math.min(...TASK.legs), mx = Math.max(...TASK.legs);
    TASK.fai = TASK.dist < 500000 ? mn >= 0.28 * TASK.dist : (mn >= 0.25 * TASK.dist && mx <= 0.45 * TASK.dist);
  }
}
function resetTask() { TASK.started = false; TASK.t0 = 0; TASK.idx = 1; TASK.done = false; TASK.achieved = 0; computeTask(); }
function updateTask(dtS) {
  if (TASK.type === 'free' || state === 'launch' || TOW.on) return;
  const pts = taskPoints();
  const dHome = Math.hypot(S.x - HOME.x, S.y - HOME.y);
  if (!TASK.started) {
    if (dHome > 1000) { TASK.started = true; TASK.t0 = S.time; msgs.push({ t: 0, txt: 'START – čas běží', big: true }); blip(700, 0.1); }
    return;
  }
  if (TASK.done) return;
  const tgt = pts[TASK.idx];
  const d = Math.hypot(S.x - tgt.x, S.y - tgt.y);
  const last = TASK.idx === pts.length - 1;
  if ((!last && d < 500) || (last && d < 1000)) {
    if (last) {
      TASK.done = true; TASK.achieved = TASK.dist;
      const tt = S.time - TASK.t0;
      msgs.push({ t: 0, txt: 'CÍL! ' + fmt1(TASK.dist / 1000) + ' km za ' + fmtTime(tt) + ' – ' + fmt1(TASK.dist / 1000 / (tt / 3600)) + ' km/h', big: true });
      blip(880, 0.25);
      saveResult(true);
      return;
    }
    msgs.push({ t: 0, txt: 'Otočný bod ' + tgt.name + ' obletěn', big: true });
    blip(820, 0.14);
    TASK.idx++;
  }
  // dosažená vzdálenost podle pravidel (dokončené úseky + postup na rozletěném)
  const cur = pts[TASK.idx];
  const dc = Math.hypot(S.x - cur.x, S.y - cur.y);
  let done = 0;
  for (let i = 0; i < TASK.idx - 1; i++) done += TASK.legs[i];
  const leg = TASK.legs[TASK.idx - 1] || 0;
  TASK.achieved = Math.max(TASK.achieved, done + clamp(leg - dc, 0, leg));
}

// =======================================================================
//  VÝSLEDKOVÁ TABULKA
// =======================================================================
let results = [];
try { results = JSON.parse(localStorage.getItem('vetron2-vysledky') || '[]'); } catch (e) { results = []; }
function saveResult(finished) {
  const tt = TASK.started ? S.time - TASK.t0 : S.time;
  const km = (TASK.type === 'free' ? S.dist : TASK.achieved) / 1000;
  const r = {
    d: new Date().toLocaleDateString('cs-CZ'),
    typ: TASK.type === 'free' ? 'Volný let' : TASK.type === 'ret' ? 'Návratová' : 'Trojúhelník' + (TASK.fai ? ' FAI' : ''),
    trat: TASK.type === 'free' ? '–' : taskPoints().map(p => p.name).join('–'),
    km: +km.toFixed(1),
    cas: fmtTime(tt),
    kmh: tt > 60 ? +(km / (tt / 3600)).toFixed(1) : 0,
    hotovo: !!finished,
    vitr: Math.round(WX.from) + '°/' + fmt1(WX.spd),
    base: WX.base,
    disc: isPG() ? 'Paraglide' : 'Větroň',
    kridlo: isPG() ? (wingNow().id + ' / ' + Math.round(PG.pilot) + ' kg') : ('G-102 / ' + Math.round(WATER.set) + ' l'),
    maxAlt: Math.round(S.maxAlt)
  };
  results.unshift(r);
  results = results.slice(0, 60);
  try { localStorage.setItem('vetron2-vysledky', JSON.stringify(results)); } catch (e) {}
  return r;
}

// =======================================================================
//  FYZIKA LETU
// =======================================================================
const msgs = [];
const spray = [];
let sprayT = 0;
const fmtTime = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600); const m = Math.floor(s % 3600 / 60); return (h ? h + ':' + String(m).padStart(2, '0') : String(m)) + ':' + String(Math.floor(s % 60)).padStart(2, '0'); };

function update(dtR) {
  if (state === 'paused' || state === 'loading' || state === 'setup' || state === 'results') return;
  const dtS = dtR * TIME_SCALES[tsIdx];
  S.iasD += (S.ias - S.iasD) * Math.min(1, dtR * 5);
  S.altD += (S.alt - S.altD) * Math.min(1, dtR * 6);
  for (let i = msgs.length - 1; i >= 0; i--) { msgs[i].t += dtR; if (msgs[i].t > 4) msgs.splice(i, 1); }
  if (state === 'over') { overT += dtR; S.varioD += (0 - S.varioD) * Math.min(1, dtR * 3); updateClouds(dtS); updateTug(dtS); return; }

  const steps = clamp(Math.ceil(dtS / 0.1), 1, 12);
  for (let i = 0; i < steps && state !== 'over'; i++) physics(dtR / steps, dtS / steps);

  // vypouštění vodní přítěže (větroň)
  if (!isPG() && WATER.dumping && WATER.cur > 0 && !TOW.on) {
    WATER.cur = Math.max(0, WATER.cur - 3.2 * dtS);
    sprayT -= dtS;
    if (sprayT <= 0) {
      sprayT = 0.05;
      for (const sd of [-1, 1]) {
        const rx = Math.sin(S.psi) * 6.5 * sd, ry = -Math.cos(S.psi) * 6.5 * sd;
        spray.push({ x: S.x + rx, y: S.y + ry, alt: S.alt - 1, t: 0, r: rand(0.6, 1.1),
          vx: rx * 0.12 + rand(-1, 1), vy: ry * 0.12 + rand(-1, 1) });
      }
    }
    if (WATER.cur === 0) msgs.push({ t: 0, txt: 'Voda vypuštěna', big: false });
  }
  for (let i = spray.length - 1; i >= 0; i--) {
    const q = spray[i];
    q.t += dtS; q.alt -= 2.2 * dtS; q.x += (WX.vx + q.vx) * dtS; q.y += (WX.vy + q.vy) * dtS; q.r += 0.9 * dtS;
    if (q.t > 7) spray.splice(i, 1);
  }
  updateClouds(dtS);
  updateAI(dtR, dtS);
  updateTask(dtS);
  updateTug(dtS);
  if (state === 'play') S.airborneT = (S.airborneT || 0) + dtR;
  if (state === 'play' && S.alt <= S.gnd && S.airborneT > 1.2) {
    hardLanding = isPG() && (S.vz < -3.2 || S.stall || S.spiral > 0.3 || S.ias > vTop() * 1.1);
    S.alt = S.gnd; S.stall = false; S.bank = 0; S.ias = 0; S.vz = 0; S.spiral = 0;
    landCode = landAt(S.x, S.y);
    const dHome = Math.hypot(S.x - HOME.x, S.y - HOME.y);
    endMsg = TASK.done ? 'Trať dokončena' : (hardLanding ? 'Tvrdé přistání' : (dHome < 1200 ? (isPG() ? 'Přistání u startovačky' : 'Přistání na ' + HOME.icao) : 'Přistání v terénu'));
    if (!TASK.done) saveResult(false);
    state = 'over'; overT = 0;
  }
}

// =======================================================================
//  PROVOZ – ostatní větroně a paraglidy (AI)
// =======================================================================
// bílé větroně, barevný jen proužek na konci křídla
const AI_COL = [
  { w: [214, 42, 34], n: 'červený' }, { w: [36, 92, 210], n: 'modrý' }, { w: [240, 190, 40], n: 'žlutý' },
];
const AI_MAX = 7;
let aiT = 0;

function aiSink(a) {
  const n = 1 / Math.cos(clamp(Math.abs(a.bank), 0, 60) * DEG);
  if (a.kind === 'para') return Math.pow(n, 1.5) * (1.05 + Math.pow(Math.max(0, a.ias - 34) / 12, 2) * 0.85);
  return Math.pow(n, 1.5) * polarG(a.ias / Math.sqrt(n));
}
function makeAI(x, y, alt, kind) {
  const c = AI_COL[Math.floor(Math.random() * AI_COL.length)];
  return {
    kind, x, y, alt, col: c, psi: rand(0, Math.PI * 2), bank: 0, vz: 0,
    ias: kind === 'para' ? 36 : rand(95, 120), mode: 'seek', dir: Math.random() < 0.5 ? -1 : 1,
    tMode: 0, tBad: 0, goal: null, cl: null, pitch: 0
  };
}
// nejlepší stoupák v okolí
function aiBestCloud(a, R) {
  let best = null, bs = -1e9;
  for (const c of clouds) {
    if (c.net <= 0.3) continue;
    const d = Math.hypot(c.x - a.x, c.y - a.y);
    if (d > R) continue;
    const s = c.net * 2 - d / 1200;
    if (s > bs) { bs = s; best = c; }
  }
  return best;
}
function aiNewGoal(a) {
  const ang = rand(0, Math.PI * 2), d = rand(6000, 18000);
  a.goal = { x: S.x + Math.cos(ang) * d, y: S.y + Math.sin(ang) * d };
}
function spawnAI(dist, kind, altAgl) {
  const ang = rand(0, Math.PI * 2);
  const halfDiag = Math.hypot(W * M, H * M / TILT) / 2;
  const d = dist === undefined ? rand(halfDiag * 1.05, halfDiag * 1.5) : dist;   // objeví se až za okrajem obrazu
  const x = S.x + Math.cos(ang) * d, y = S.y + Math.sin(ang) * d;
  const gnd = terrainElev(x, y);
  const k = kind || (Math.random() < (WX.spd > 3.5 ? 0.25 : 0.12) ? 'para' : 'glider');
  const agl = altAgl !== undefined ? altAgl : (k === 'para' ? rand(120, 500) : rand(350, Math.max(600, WX.base - gnd - 250)));
  const a = makeAI(x, y, Math.min(WX.base - 60, gnd + agl), k);
  AI.push(a);
  return a;
}
function seedAI() {
  AI.length = 0;
  for (let i = 0; i < 4; i++) {
    // čtyři větroně do 1000 m od startu, snaží se udržet ve vzduchu
    const ang = Math.PI * 2 * (i / 4) + rand(-0.4, 0.4), d = rand(450, 1000);
    const x = S.x + Math.cos(ang) * d, y = S.y + Math.sin(ang) * d;
    const gnd = terrainElev(x, y);
    const a = makeAI(x, y, gnd + rand(180, 520), 'glider');
    a.psi = ang + Math.PI / 2;
    AI.push(a);
  }
  if (isPG()) for (let i = 0; i < 2; i++) {
    const ang = rand(0, Math.PI * 2), d = rand(350, 900);
    const x = S.x + Math.cos(ang) * d, y = S.y + Math.sin(ang) * d;
    AI.push(makeAI(x, y, terrainElev(x, y) + rand(60, 260), 'para'));
  }
}

function updateAI(dtR, dtS) {
  aiT += dtS;
  const lim = Math.hypot(W * M, H * M / TILT) * 1.5;      // 1,5 obrazovky → mazání
  for (let i = AI.length - 1; i >= 0; i--) {
    const a = AI[i];

  ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();
  // komory
  ctx.strokeStyle = 'rgba(60,30,20,0.35)'; ctx.lineWidth = 0.7;
  for (let i = 1; i < N; i++) { ctx.beginPath(); ctx.moveTo(segs[i][0][0], segs[i][0][1]); ctx.lineTo(segs[i][1][0], segs[i][1][1]); ctx.stroke(); }
  // náběžná hrana s nasávacími otvory
  ctx.strokeStyle = 'rgba(35,25,25,0.75)'; ctx.lineWidth = 1.6;
  ctx.beginPath(); segs.forEach((s, i) => i ? ctx.lineTo(s[0][0], s[0][1]) : ctx.moveTo(s[0][0], s[0][1])); ctx.stroke();
  // šňůry
  ctx.strokeStyle = 'rgba(30,30,36,0.5)'; ctx.lineWidth = 0.6;
  for (const t of [-0.85, -0.55, -0.25, 0.25, 0.55, 0.85]) {
    const p = sec(t)[1];
    ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(gx, gy); ctx.stroke();
  }
  // pilot v sedačce
  const bodyF = Pp(xf([0.55, 0, 0.35])), bodyB = Pp(xf([-0.55, 0, -0.1]));
  ctx.strokeStyle = '#2a3340'; ctx.lineWidth = SC * 0.55; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(bodyB[0], bodyB[1]); ctx.lineTo(bodyF[0], bodyF[1]); ctx.stroke();
  const head = Pp(xf([0.35, 0, 0.75]));
  ctx.fillStyle = '#f0e6d2';
  ctx.beginPath(); ctx.arc(head[0], head[1], SC * 0.26, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawParaShadow(gx, gy, psi, bankDeg, alpha) {
  const SC = SPR, span = 11;
  ctx.fillStyle = `rgba(15,30,15,${alpha})`;
  ctx.save(); ctx.translate(gx, gy); ctx.rotate(psi + Math.PI / 2); ctx.scale(1, TILT);
  ctx.beginPath(); ctx.ellipse(0, 0, span * SC * 0.5 * Math.cos(bankDeg * DEG * 0.6), 2.4 * SC * 0.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// ---------- mraky ----------
function cloudPuffs(c) {
  const R = c.R, V = c.V, sp = 1 + 0.35 * c.dd, shrink = 1 - 0.4 * c.dd;
  const out = [];
  for (const p of c.puffs) {
    if (p.z > V + 0.05) continue;
    const grow = clamp((V + 0.05 - p.z) / 0.14, 0, 1);
    const X = c.x + (p.dx * sp + p.ox * 0.04 * c.dd) * R, Y = c.y + (p.dy * sp + p.oy * 0.04 * c.dd) * R;
    const rad = p.r * R / M * grow * shrink;
    if (rad < 1) continue;
    out.push({ X, Y, z: p.z, rad, lift: p.z * R * HZ, base: p.z < 0.12 });
  }
  return out;
}
function drawCloudShadows(list) {
  shx.setTransform(1, 0, 0, 1, 0, 0);
  shx.clearRect(0, 0, shadowCv.width, shadowCv.height);
  shx.setTransform(1 / SHQ, 0, 0, 1 / SHQ, 0, 0);
  for (const { c, puffs } of list) {
    if (c.op < 0.02) continue;
    shx.fillStyle = `rgba(10,25,40,${0.30 * c.op})`;
    shx.beginPath();
    for (const p of puffs) {
      if (p.z > 0.55) continue;
      const x = sx(p.X + WX.base * SHX), y = sy(p.Y + WX.base * SHY, 0);
      shx.moveTo(x + p.rad * 1.05, y); shx.ellipse(x, y, p.rad * 1.05, p.rad * TILT * 1.05, 0, 0, Math.PI * 2);
    }
    shx.fill();
  }
  ctx.drawImage(shadowCv, 0, 0, W, H);
}
function drawCloud(c, puffs) {
  const op = c.op * c.fade;
  if (op < 0.01) return;
  const baseAgl = Math.max(120, WX.base - terrainElev(c.x, c.y));
  const arr = puffs.map(p => ({ p, x: sx(p.X), y: sy(p.Y, baseAgl) - p.lift, d: p.Y * COSB - (WX.base + p.z * c.R) * TILT }));
  arr.sort((a, b) => b.d - a.d);
  for (const { p, x, y } of arr) {
    const r = p.rad;
    ctx.globalAlpha = op * (0.6 + 0.4 * (1 - c.sharp));
    ctx.drawImage(p.base ? PUFF.softB : PUFF.soft, x - r * 1.3, y - r * 1.3, r * 2.6, r * 2.6);
    if (c.sharp > 0.02) {
      ctx.globalAlpha = op * c.sharp * 0.9;
      ctx.drawImage(p.base ? PUFF.sharpB : PUFF.sharp, x - r * 0.94, y - r * 0.94, r * 1.88, r * 1.88);
    }
  }
  ctx.globalAlpha = 1;
}
// ---------- heatmapa stoupáků (Q) ----------
function drawHeat(now) {
  if (WAVE.on) {
    // pásy závětrné vlny přes celou obrazovku (hladce)
    const zRef = clamp(S.alt, WX.base - 700, WX.base + 900);
    const GS2 = 22, gw = Math.ceil(W / GS2), gh = Math.ceil(H / GS2);
    if (wvB.width !== gw || wvB.height !== gh) { wvB.width = gw; wvB.height = gh; }
    const im = wvX.createImageData(gw, gh), DD = im.data;
    for (let v2 = 0; v2 < gh; v2++) for (let u2 = 0; u2 < gw; u2++) {
      const wx = camX + ((u2 + 0.5) * GS2 - W / 2) * M;
      const wy = camY - ((v2 + 0.5) * GS2 - anchorY) * M / TILT;
      const v = waveAt(wx, wy, zRef);
      const i2 = (v2 * gw + u2) * 4;
      const up = v > 0, m = Math.min(1, Math.abs(v) / (up ? 6 : 4));
      DD[i2] = up ? 229 : 41; DD[i2 + 1] = up ? 57 : 98; DD[i2 + 2] = up ? 53 : 255;
      DD[i2 + 3] = Math.abs(v) < 0.4 ? 0 : Math.round(Math.pow(m, 0.8) * (up ? 92 : 74));
    }
    wvX.putImageData(im, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(wvB, 0, 0, W, H);
  }
  for (const c of clouds) {
    const lift = c.net > -1;
    const N = Math.min(80, 18 + Math.floor(c.rr / 16));
    const col = lift ? '229,57,53' : '41,98,255';
    const strength = clamp(Math.abs(c.net + (lift ? 0 : 1)) / 4, 0.15, 1);
    for (let i = 0; i < N; i++) {
      const a = hash(i, 1, 5) * Math.PI * 2, d = Math.pow(hash(i, 2, 7), 1.7) * c.rr * 0.85;
      const px = c.x + Math.cos(a) * d, py = c.y + Math.sin(a) * d;
      const ph = (now * (0.3 + strength * 0.6) + hash(i, 3, 9)) % 1;
      const h = lift ? ph * 110 : (1 - ph) * 110;
      const x = sx(px), y = sy(py, 0) - h;
      const al = clamp(1 - Math.abs(ph - 0.45) * 1.3, 0, 1) * (0.65 + 0.35 * strength);
      if (al <= 0) continue;
      ctx.fillStyle = `rgba(${col},${al})`;
      ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(255,255,255,${al * 0.5})`;
      ctx.beginPath(); ctx.arc(x - 1, y - 1, 1.2, 0, Math.PI * 2); ctx.fill();
    }
    // střed
    ctx.strokeStyle = lift ? 'rgba(229,57,53,0.9)' : 'rgba(41,98,255,0.85)';
    ctx.lineWidth = 2; ctx.setLineDash([6, 5]);
    ctx.beginPath(); ctx.ellipse(sx(c.x), sy(c.y, 0), c.rr / M, c.rr / M * TILT, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    plainTxt((c.net > 0 ? '+' : '') + fmt1(c.net) + ' m/s', sx(c.x), sy(c.y, 0) + 6, 12, lift ? '#ffdcd8' : '#dbe6ff', 'center', 800);
  }
}

function tiltShift() {
  if (!FX) { ctx.drawImage(vig, 0, 0, W, H); return; }
  const mw = tsM.width, mh = tsM.height;
  tsAx.drawImage(cv, 0, 0, tsA.width, tsA.height);
  tsBx.drawImage(tsA, 0, 0, tsB.width, tsB.height);
  tsMx.globalCompositeOperation = 'source-over';
  tsMx.clearRect(0, 0, mw, mh);
  tsMx.drawImage(tsB, 0, 0, mw, mh);
  tsMx.globalCompositeOperation = 'destination-in';
  const g = tsMx.createLinearGradient(0, 0, 0, mh);
  g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.3, 'rgba(0,0,0,0)');
  g.addColorStop(0.7, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.95)');
  tsMx.fillStyle = g; tsMx.fillRect(0, 0, mw, mh);
  ctx.drawImage(tsM, 0, 0, W, H);
  ctx.drawImage(vig, 0, 0, W, H);
}

function drawScene(dtR) {
  frameNo++;
  const look = 320;
  let tx = S.x + Math.cos(S.psi) * look, ty = S.y + Math.sin(S.psi) * look;
  // při kroužení kamera drží střed kruhu
  if (state !== 'launch' && !TOW.on && Math.abs(S.bank) > 10) {
    const v = Math.max(15, S.ias / 3.6);
    const rad = v * v / (G * Math.tan(clamp(Math.abs(S.bank), 5, 60) * DEG));
    const sgn = S.bank > 0 ? 1 : -1;
    const cxT = S.x + Math.sin(S.psi) * rad * sgn, cyT = S.y - Math.cos(S.psi) * rad * sgn;
    const f = clamp((Math.abs(S.bank) - 10) / 16, 0, 1);
    tx = lerp(tx, cxT, f); ty = lerp(ty, cyT, f);
  }
  const agl = aglOf(S.alt, S.x, S.y);
  const ta = H * 0.5 + agl * KZ;
  if (!camInit) { camX = tx; camY = ty; anchorY = ta; camInit = true; }
  camX += (tx - camX) * Math.min(1, dtR * 1.5); camY += (ty - camY) * Math.min(1, dtR * 1.5);
  anchorY += (ta - anchorY) * Math.min(1, dtR * 2);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawGround();
  const list = [];
  for (const c of clouds) {
    const px = sx(c.x), py = sy(c.y, 0);
    const rp = c.R / M + 120;
    if (px < -rp || px > W + rp || py < -rp - 400 || py > H + rp) continue;   // mimo obraz
    list.push({ c, puffs: cloudPuffs(c) });
  }
  drawCloudShadows(list);
  if (heat) drawHeat(performance.now() / 1000);

  // stroj
  const gx = sx(S.x), gy = sy(S.y, 0) - agl * KZ;
  if (isPG()) {
    drawParaShadow(sx(S.x + S.alt * SHX), sy(S.y + S.alt * SHY, 0), S.psi, S.bank, clamp(0.32 - agl / 5000, 0.12, 0.32));
    drawPara(gx, gy, S.psi, S.bank, S.pend, agl * KZ, 1);
  } else {
    const tugAgl = aglOf(TOW.alt, TOW.x, TOW.y);
    const tgx = sx(TOW.x), tgy = sy(TOW.y, 0) - tugAgl * KZ;
    if (TOW.tug) drawPlaneShadow(sx(TOW.x + TOW.alt * SHX), sy(TOW.y + TOW.alt * SHY, 0), TOW.psi, 0, 0, clamp(0.3 - tugAgl / 5000, 0.1, 0.3), 'tug', 0.9);
    drawPlaneShadow(sx(S.x + S.alt * SHX), sy(S.y + S.alt * SHY, 0), S.psi, S.bank, S.pitch, clamp(0.34 - agl / 5000, 0.12, 0.34));
    if (TOW.tug) drawPlane(tgx, tgy, TOW.psi, 0, TOW.phase === 0 ? 0 : -0.07, 'tug', 0.9);
    if (TOW.on) {
      ctx.strokeStyle = 'rgba(40,40,45,0.75)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(tgx - 4, tgy + 2); ctx.lineTo(gx + 4, gy - 1); ctx.stroke();
    }
    for (const q of spray) {
      const a = clamp(1 - q.t / 7, 0, 1) * 0.5;
      if (a <= 0) continue;
      ctx.fillStyle = `rgba(238,250,255,${a})`;
      ctx.beginPath(); ctx.arc(sx(q.x), sy(q.y, 0) - aglOf(q.alt, q.x, q.y) * KZ, q.r, 0, Math.PI * 2); ctx.fill();
    }
    drawPlane(gx, gy, S.psi, S.bank, S.pitch, 'glider', 1);
  }

  // ostatní stroje
  if (AI.length) {
    const sorted = AI.slice().sort((a, b) => b.y - a.y);
    for (const a of AI) {
      const aAgl = aglOf(a.alt, a.x, a.y);
      const sh = clamp(0.3 - aAgl / 5000, 0.08, 0.3);
      if (a.kind === 'para') drawParaShadow(sx(a.x + a.alt * SHX), sy(a.y + a.alt * SHY, 0), a.psi, a.bank, sh);
      else drawPlaneShadow(sx(a.x + a.alt * SHX), sy(a.y + a.alt * SHY, 0), a.psi, a.bank, a.pitch, sh);
    }
    for (const a of sorted) {
      const px = sx(a.x), py = sy(a.y, 0) - aglOf(a.alt, a.x, a.y) * KZ;
      if (px < -80 || px > W + 80 || py < -80 || py > H + 80) continue;
      if (a.kind === 'para') drawPara(px, py, a.psi, a.bank, 0, 0, 1, aiPal(a));
      else drawPlane(px, py, a.psi, a.bank, a.pitch, 'glider', 0.92, a.col.w);
    }
  }
  // lentikulární mraky nad závětrnou vlnou
  if (WCL.length) {
    for (const w of WCL) {
      const px = sx(w.x), py = sy(w.y, Math.max(120, w.z - terrainElev(w.x, w.y)));
      const rx = w.rx / M, ry = w.ry / M * TILT;
      if (px < -rx || px > W + rx || py < -ry - 200 || py > H + ry) continue;
      ctx.save();
      ctx.translate(px, py); ctx.rotate(-w.rot);
      const g = ctx.createRadialGradient(0, 0, rx * 0.1, 0, 0, rx);
      g.addColorStop(0, `rgba(255,255,255,${0.92 * w.op})`);
      g.addColorStop(0.6, `rgba(246,250,255,${0.7 * w.op})`);
      g.addColorStop(1, 'rgba(240,246,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(150,170,195,${0.25 * w.op})`;
      ctx.beginPath(); ctx.ellipse(0, ry * 0.45, rx * 0.82, ry * 0.4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }
  list.sort((a, b) => b.c.y - a.c.y);
  for (const it of list) {
    const c = it.c;
    const ccx = sx(c.x), ccy = sy(c.y, Math.max(120, WX.base - terrainElev(c.x, c.y))) - c.R * c.V * HZ * 0.4;
    const cover = Math.hypot(gx - ccx, (gy - ccy) * 1.4) < c.R / M * 1.05;
    c.fade += ((cover ? 0.4 : 1) - c.fade) * Math.min(1, dtR * 4);
    drawCloud(c, it.puffs);
  }
  tiltShift();
}

// =======================================================================
//  POHLED Z KOKPITU (klávesa C)
// =======================================================================
let view = 0;                    // 0 = maketa krajiny, 1 = kokpit
const GT = document.createElement('canvas');   // podklad terénu kolem větroně
const GTX = GT.getContext('2d');
const GT_R = 4000;               // dosah podkladu [m]
let gtCx = 1e9, gtCy = 1e9, gtX0 = 0, gtY0 = 0;
GT.width = Math.ceil(GT_R * 2 / M) + 8;
GT.height = Math.ceil(GT_R * 2 / (M / TILT)) + 8;
const uiBandH = () => (H > W * 1.05 ? stickGeom().r * 2 + 34 : 0);   // v portrétu držíme dole místo na ovládání
let dispH = 0, dispP = 0;        // posun horizontu a palubovky [px]

// silueta vzdálených kopců (profil se přepočítává jen občas, projekce každý snímek)
let silProf = null, silX = 1e9, silY = 1e9, silPsi = 9, silT = 0;
function silhouetteProfile(C) {
  const now = performance.now();
  if (silProf && Math.hypot(S.x - silX, S.y - silY) < 250 && Math.abs(S.psi - silPsi) < 0.05 && now - silT < 500) return silProf;
  silX = S.x; silY = S.y; silPsi = S.psi; silT = now;
  const tanH = (W / 2) / C.f * 1.05;
  const N = 24;
  const out = [];
  for (let i = 0; i <= N; i++) {
    const u = -tanH + (2 * tanH) * i / N;
    const az = Math.atan(u);
    const cx = Math.cos(S.psi + az), cy = Math.sin(S.psi + az);
    let best = null, bestA = -1e9;
    for (let d = 2600; d <= 30000; d *= 1.28) {
      const x = S.x + cx * d, y = S.y + cy * d;
      const z = terrainElev(x, y);
      const ang = (z - S.alt) / d;                 // výškový úhel
      if (ang > bestA) { bestA = ang; best = { x, y, z, d }; }
    }
    out.push({ u, p: best, ang: bestA });
  }
  silProf = out;
  return out;
}
let gtCont = false, gtVer = -1, gtT = 0;
function composeGT(force) {
  const now = performance.now();
  const moved = Math.hypot(S.x - gtCx, S.y - gtCy) >= 220;
  const fresh = gtVer !== tilesVer && now - gtT > 700;      // nové dlaždice jen občas
  if (!force && !moved && !fresh && gtCont === contours) return;
  gtCont = contours; gtVer = tilesVer; gtT = now;
  gtCx = S.x; gtCy = S.y;
  gtX0 = Math.round(S.x / M - GT.width / 2);
  gtY0 = Math.round(-S.y / M * TILT - GT.height / 2);
  GTX.setTransform(1, 0, 0, 1, 0, 0);
  GTX.fillStyle = '#8fb46a'; GTX.fillRect(0, 0, GT.width, GT.height);
  const tx0 = Math.floor(gtX0 / TS), tx1 = Math.floor((gtX0 + GT.width) / TS);
  const ty0 = Math.floor(gtY0 / TS), ty1 = Math.floor((gtY0 + GT.height) / TS);
  for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
    const t = tiles.get(tkey(tx, ty));
    if (!t) continue;
    t.used = frameNo;
    GTX.drawImage(t.canvas, tx * TS - gtX0, ty * TS - gtY0, TS + 0.6, TS + 0.6);
  }
  if (contours) {
    GTX.lineCap = 'round';
    for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
      const t = tiles.get(tkey(tx, ty));
      if (t) strokeContours(GTX, t, tx * TS - gtX0, ty * TS - gtY0, 50, 4, 1);
    }
  }
  for (const c of clouds) {           // stíny mraků
    if (c.op < 0.05) continue;
    GTX.fillStyle = `rgba(10,25,40,${0.3 * c.op})`;
    GTX.beginPath();
    for (const p of cloudPuffs(c)) {
      if (p.z > 0.55) continue;
      const ux = (p.X + WX.base * SHX) / M - gtX0, uy = -(p.Y + WX.base * SHY) / M * TILT - gtY0;
      GTX.moveTo(ux + p.rad, uy); GTX.ellipse(ux, uy, p.rad, p.rad * TILT, 0, 0, Math.PI * 2);
    }
    GTX.fill();
  }
}

// perspektivní projekce z kabiny
function makeCam() {
  const th = 0.30;                 // pohled přes příď dolů (podélný sklon se řeší posuny obrazu)
  const ch = Math.cos(S.psi), sh = Math.sin(S.psi);
  const ct = Math.cos(th), st = Math.sin(th);
  const fwd = [ch * ct, sh * ct, -st];
  const right = [sh, -ch, 0];
  const up = [ch * st, sh * st, ct];
  const f = (W / 2) / Math.tan(52 * DEG);     // ~104° vodorovně – široký rozhled z kabiny
  const cam = [S.x, S.y, S.alt];
  const proj = (x, y, z) => {
    const rx = x - cam[0], ry = y - cam[1], rz = z - cam[2];
    const F = rx * fwd[0] + ry * fwd[1] + rz * fwd[2];
    if (F <= 1) return null;
    const R = rx * right[0] + ry * right[1] + rz * right[2];
    const U = rx * up[0] + ry * up[1] + rz * up[2];
    return [W / 2 + f * R / F, H / 2 - f * U / F, F];
  };
  return { fwd, right, up, f, cam, proj, th };
}

// podélný náklon: posun horizontu a palubovky
function attitudeShift(dtR) {
  let tH, tP;
  if (isPG()) {
    const vt = vTrim();
    if (S.stall) { tH = -0.26 * H; tP = -0.18 * H; }     // přetažení: křídlo vzadu, pilot se houpe dopředu
    else {
      // podélný sklon dává rychlost + kyv pod křídlem
      let s = clamp((S.ias - vt) / (vTop() - vt), -1.4, 1.4);
      s = clamp(s - S.pend * 0.03, -2, 2);
      tH = 0.15 * H * s; tP = 0.15 * H * s;
      if (S.spiral > 0.05) { tH += 0.18 * H * S.spiral; tP += 0.10 * H * S.spiral; }
    }
    const k = Math.min(1, dtR * 3.5);
    dispH += (tH - dispH) * k;
    dispP += (clamp(tP, -0.13 * H, 0.06 * H) - dispP) * k;
    return;
  }
  // větroň: rychlost + zrychlení dávají podélný sklon
  if (S.stall) { tH = 0.30 * H; tP = 0.20 * H; }
  else {
    const ias = S.ias || 90;
    let s = ias >= 90 ? clamp((ias - 90) / 110, 0, 1) : -clamp((90 - ias) / 20, 0, 1);
    s = clamp(s + (S.accel || 0) * 0.9, -2, 2);
    tH = 0.15 * H * s; tP = 0.15 * H * s;
  }
  const k = Math.min(1, dtR * 3.5);
  dispH += (tH - dispH) * k;
  dispP += (clamp(tP, -0.15 * H, 0.10 * (H - uiBandH())) - dispP) * k;
}

// heatmapa stoupáků v perspektivě
function heatCockpit(C, now) {
  // pásy závětrné vlny
  if (WAVE.on) {
    const ux = WX.vx / WX.spd, uy = WX.vy / WX.spd;
    const px2 = -uy, py2 = ux;
    const step = WAVE.lam / 12;
    for (let k = -14; k <= 26; k++) {
      const d = k * step;
      const bx = S.x + ux * d, by = S.y + uy * d;
      if (Math.hypot(bx - S.x, by - S.y) > 26000) continue;
      const zRef = Math.max(terrainElev(bx, by) + 700, WX.base - 200);
      const v = waveAt(bx, by, zRef);
      if (Math.abs(v) < 0.8) continue;
      const lift = v > 0;
      const col = lift ? '229,57,53' : '41,98,255';
      for (let i = -7; i <= 7; i++) {
        const sx2 = bx + px2 * i * 900, sy2 = by + py2 * i * 900;
        const gz = terrainElev(sx2, sy2);
        const top = Math.min(WX.base + 700, gz + 2000);
        const ph = (now * 0.14 + hash(k + 40, i + 20, 11)) % 1;
        const z = gz + 200 + (lift ? ph : 1 - ph) * (top - gz - 200);
        const pr = C.proj(sx2, sy2, z);
        if (!pr) continue;
        const al = clamp(1 - Math.abs(ph - 0.45) * 1.2, 0, 1) * clamp(Math.abs(v) / 5, 0.2, 1) * 0.8;
        const rr = clamp(C.f * 14 / pr[2], 1.4, 18);
        ctx.fillStyle = `rgba(${col},${al})`;
        ctx.beginPath(); ctx.arc(pr[0], pr[1], rr, 0, Math.PI * 2); ctx.fill();
      }
    }
  }
  for (const c of clouds) {
    const dist = Math.hypot(c.x - S.x, c.y - S.y);
    if (dist > 9000) continue;
    const lift = c.net > -1;
    const col = lift ? '229,57,53' : '41,98,255';
    const strength = clamp(Math.abs(c.net + (lift ? 0 : 1)) / 4, 0.15, 1);
    const gz = terrainElev(c.x, c.y);
    const top = Math.min(WX.base, gz + 1400);
    // kruh na zemi
    ctx.strokeStyle = lift ? 'rgba(229,57,53,0.8)' : 'rgba(41,98,255,0.75)';
    ctx.lineWidth = 2; ctx.setLineDash([7, 6]);
    ctx.beginPath();
    let started = false;
    for (let a = 0; a <= Math.PI * 2 + 0.01; a += Math.PI / 16) {
      const p = C.proj(c.x + Math.cos(a) * c.rr, c.y + Math.sin(a) * c.rr, gz);
      if (!p) { started = false; continue; }
      started ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); started = true;
    }
    ctx.stroke(); ctx.setLineDash([]);
    const N = Math.min(70, 20 + Math.floor(c.rr / 18));
    for (let i = 0; i < N; i++) {
      const a = hash(i, 1, 5) * Math.PI * 2, d = Math.pow(hash(i, 2, 7), 1.7) * c.rr * 0.85;
      const px = c.x + Math.cos(a) * d, py = c.y + Math.sin(a) * d;
      const ph = (now * (0.12 + strength * 0.22) + hash(i, 3, 9)) % 1;
      const z = gz + 40 + (lift ? ph : 1 - ph) * (top - gz - 60);
      const pr = C.proj(px, py, z);
      if (!pr) continue;
      const al = clamp(1 - Math.abs(ph - 0.45) * 1.3, 0, 1) * (0.6 + 0.4 * strength);
      const rr = clamp(C.f * 7 / pr[2], 1, 14);
      ctx.fillStyle = `rgba(${col},${al})`;
      ctx.beginPath(); ctx.arc(pr[0], pr[1], rr, 0, Math.PI * 2); ctx.fill();
    }
  }
}

function drawCockpit(dtR) {
  frameNo++;
  composeGT(false);
  attitudeShift(dtR);
  const C = makeCam();
  const gndZ = S.gnd;
  const h = Math.max(2.5, S.alt - gndZ);
  const bankW = isPG() ? clamp(S.bank * 0.50, -12, 12) : clamp(S.bank * 0.18, -8, 8);
  const bankP = S.bank - bankW;                     // zbytek náklonu ukáže kabina
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.save();
  ctx.translate(W / 2, H / 2 - dispH);
  ctx.rotate(-bankW * DEG);
  ctx.translate(-W / 2, -H / 2);
  const OV = Math.hypot(W, H) * 0.75;
  const worldTransform = () => {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.translate(W / 2, H / 2 - dispH);
    ctx.rotate(-bankW * DEG);
    ctx.translate(-W / 2, -H / 2);
  };
  // obloha
  const sky = ctx.createLinearGradient(0, -OV, 0, H);
  sky.addColorStop(0, '#1f6fc4'); sky.addColorStop(0.55, '#6fb6ec'); sky.addColorStop(1, '#cfe6f5');
  ctx.fillStyle = sky; ctx.fillRect(-OV, -OV, W + OV * 2, H + OV * 2);
  const sp = C.proj(S.x - 8000, S.y + 8000, S.alt + 5200);
  if (sp) {
    const g = ctx.createRadialGradient(sp[0], sp[1], 4, sp[0], sp[1], 190);
    g.addColorStop(0, 'rgba(255,250,220,0.95)'); g.addColorStop(1, 'rgba(255,250,220,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sp[0], sp[1], 190, 0, Math.PI * 2); ctx.fill();
  }
  // obzor a vzdálená krajina
  const fx = Math.cos(S.psi), fy = Math.sin(S.psi);
  const p0 = C.proj(S.x + fx * 1e6, S.y + fy * 1e6, gndZ);
  const hzY = p0 ? p0[1] : H * 0.4;
  const fg = ctx.createLinearGradient(0, hzY, 0, H + OV);
  fg.addColorStop(0, '#b9cfda'); fg.addColorStop(0.08, '#a9c39c'); fg.addColorStop(0.35, '#9dbb85'); fg.addColorStop(1, '#8fb46a');
  ctx.fillStyle = fg; ctx.fillRect(-OV, hzY, W + OV * 2, H + OV * 2 - hzY);

  // ===== silueta vzdálených kopců nad obzorem =====
  {
    const prof = silhouetteProfile(C);
    let any = false;
    const pts = [];
    for (const q of prof) {
      if (!q.p) { pts.push(null); continue; }
      const pr = C.proj(q.p.x, q.p.y, q.p.z);
      if (!pr) { pts.push(null); continue; }
      pts.push([W / 2 + C.f * q.u, pr[1]]);
      if (pr[1] < hzY - 1) any = true;
    }
    if (any) {
      ctx.save();
      ctx.beginPath();
      let started = false;
      for (const p of pts) {
        if (!p) continue;
        started ? ctx.lineTo(p[0], Math.min(p[1], hzY)) : ctx.moveTo(p[0], Math.min(p[1], hzY));
        started = true;
      }
      ctx.lineTo(W + OV, hzY + 4); ctx.lineTo(-OV, hzY + 4); ctx.closePath();
      const sg = ctx.createLinearGradient(0, hzY - 220, 0, hzY + 10);
      sg.addColorStop(0, 'rgba(142,166,152,0.96)'); sg.addColorStop(0.7, 'rgba(162,184,168,0.95)'); sg.addColorStop(1, 'rgba(186,206,214,0.9)');
      ctx.fillStyle = sg; ctx.fill();
      ctx.restore();
    }
  }

  // ===== terén v pásech; každý pás se dělí na sloupce (ostré okraje bez rozmazání) =====
  const dFar = 3300, dNear = Math.max(8, h * 0.1);
  const ds = [];
  for (let d = dFar; d > dNear; d /= 1.075) ds.push(d);
  ds.push(dNear);
  const ez = ds.map(d => terrainElev(S.x + fx * d, S.y + fy * d));
  for (let i = 1; i < ez.length - 1; i++) ez[i] = (ez[i - 1] + ez[i] * 2 + ez[i + 1]) / 4;   // vyhlazení
  const yAt = (d, z) => { const p = C.proj(S.x + fx * d, S.y + fy * d, z); return p ? p[1] : -1e5; };
  const ys = ds.map((d, i) => yAt(d, ez[i]));
  const rxv = Math.sin(S.psi), ryv = -Math.cos(S.psi);
  const NC = W > 1100 ? 6 : (W > 700 ? 5 : 4);          // sloupců na pás
  const tanH = (W / 2) / C.f;
  for (let i = 0; i < ds.length - 1; i++) {
    const d = ds[i], dn = ds[i + 1];
    const yTop = ys[i], yBot = ys[i + 1];
    const cTop = Math.min(yTop, yBot) - 1.5, cBot = Math.max(yTop, yBot) + 1.5;
    if (cBot < -OV || cTop > H + OV) continue;
    // rovina pásu nikdy nesmí být nad pilotem, jinak by se obraz překlopil
    const zPlane = Math.min((ez[i] + ez[i + 1]) / 2, S.alt - 4);
    const dm = (d + dn) / 2;
    for (let k = 0; k < NC; k++) {
      const u0 = (k / NC * 2 - 1) * tanH, u1 = ((k + 1) / NC * 2 - 1) * tanH;
      const uc = (u0 + u1) / 2, du = u1 - u0;
      const bx = S.x + fx * dm + rxv * uc * dm, by = S.y + fy * dm + ryv * uc * dm;
      const P = [
        [bx, by],
        [bx + rxv * du * dm, by + ryv * du * dm],
        [S.x + (bx - S.x) * 1.22, S.y + (by - S.y) * 1.22]
      ];
      const sPts = P.map(p => C.proj(p[0], p[1], zPlane));
      if (sPts.some(p => !p)) continue;
      const gPts = P.map(p => [p[0] / M - gtX0, -p[1] / M * TILT - gtY0]);
      const G1 = [gPts[1][0] - gPts[0][0], gPts[1][1] - gPts[0][1]];
      const G2 = [gPts[2][0] - gPts[0][0], gPts[2][1] - gPts[0][1]];
      const det = G1[0] * G2[1] - G1[1] * G2[0];
      if (Math.abs(det) < 1e-9) continue;
      const S1 = [sPts[1][0] - sPts[0][0], sPts[1][1] - sPts[0][1]];
      const S2 = [sPts[2][0] - sPts[0][0], sPts[2][1] - sPts[0][1]];
      const a = (S1[0] * G2[1] - S2[0] * G1[1]) / det;
      const c = (-S1[0] * G2[0] + S2[0] * G1[0]) / det;
      const bq = (S1[1] * G2[1] - S2[1] * G1[1]) / det;
      const dq = (-S1[1] * G2[0] + S2[1] * G1[0]) / det;
      if (a * dq - bq * c <= 0) continue;          // převrácený obraz se nekreslí
      const e = sPts[0][0] - (a * gPts[0][0] + c * gPts[0][1]);
      const fq = sPts[0][1] - (bq * gPts[0][0] + dq * gPts[0][1]);
      const cx0 = k / NC * W, cw = W / NC;
      ctx.save();
      ctx.beginPath(); ctx.rect(cx0 - 0.6, cTop, cw + 1.2, cBot - cTop); ctx.clip();
      worldTransform();
      ctx.transform(a, bq, c, dq, e, fq);
      ctx.drawImage(GT, 0, 0);
      ctx.restore();
    }
  }
  // opar u obzoru
  const hEnd = Math.max(hzY + 40, yAt(2600, gndZ));
  const hg = ctx.createLinearGradient(0, hzY - 8, 0, hEnd);
  hg.addColorStop(0, 'rgba(198,220,236,0.92)'); hg.addColorStop(0.4, 'rgba(198,220,236,0.45)'); hg.addColorStop(1, 'rgba(198,220,236,0)');
  ctx.fillStyle = hg; ctx.fillRect(-OV, hzY - 8, W + OV * 2, hEnd - hzY + 8);

  if (heat) heatCockpit(C, performance.now() / 1000);

  // lentikulární mraky nad vlnou
  if (WCL.length) {
    for (const wc of WCL) {
      const d0 = Math.hypot(wc.x - S.x, wc.y - S.y);
      if (d0 > 45000) continue;
      const ax = Math.cos(wc.rot), ay = Math.sin(wc.rot);
      const pc = C.proj(wc.x, wc.y, wc.z);
      const pa = C.proj(wc.x + ax * wc.rx, wc.y + ay * wc.rx, wc.z);
      const pb = C.proj(wc.x - ax * wc.rx, wc.y - ay * wc.rx, wc.z);
      if (!pc || !pa || !pb) continue;
      const ex = (pa[0] - pb[0]) / 2, ey = (pa[1] - pb[1]) / 2;
      const rA = Math.hypot(ex, ey), ang = Math.atan2(ey, ex);
      const rB = Math.max(1.5, C.f * wc.ry / pc[2]);
      if (rA < 3 || pc[0] < -rA - OV || pc[0] > W + rA + OV) continue;
      ctx.save();
      ctx.translate(pc[0], pc[1]); ctx.rotate(ang);
      const g = ctx.createRadialGradient(0, 0, rA * 0.08, 0, 0, rA);
      g.addColorStop(0, `rgba(255,255,255,${0.95 * wc.op})`);
      g.addColorStop(0.55, `rgba(248,251,255,${0.72 * wc.op})`);
      g.addColorStop(1, 'rgba(244,249,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(0, 0, rA, rB, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(140,162,190,${0.22 * wc.op})`;
      ctx.beginPath(); ctx.ellipse(0, rB * 0.5, rA * 0.8, rB * 0.42, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }
  // mraky
  const puffs = [];
  for (const c of clouds) {
    if (c.op < 0.02) continue;
    if (Math.hypot(c.x - S.x, c.y - S.y) > 16000) continue;
    for (const p of cloudPuffs(c)) {
      const z = WX.base + p.z * c.R * 1.1;
      const pr = C.proj(p.X, p.Y, z);
      if (!pr) continue;
      puffs.push({ x: pr[0], y: pr[1], r: C.f * (p.rad * M) / pr[2], F: pr[2], c, base: p.base });
    }
  }
  puffs.sort((a, b) => b.F - a.F);
  for (const q of puffs) {
    if (q.r < 0.6 || q.x < -OV - q.r || q.x > W + OV + q.r) continue;
    const op = q.c.op;
    ctx.globalAlpha = op * (0.6 + 0.4 * (1 - q.c.sharp));
    ctx.drawImage(q.base ? PUFF.softB : PUFF.soft, q.x - q.r * 1.3, q.y - q.r * 1.3, q.r * 2.6, q.r * 2.6);
    if (q.c.sharp > 0.02) {
      ctx.globalAlpha = op * q.c.sharp * 0.9;
      ctx.drawImage(q.base ? PUFF.sharpB : PUFF.sharp, q.x - q.r * 0.94, q.y - q.r * 0.94, q.r * 1.88, q.r * 1.88);
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (!isPG()) {
    // vlečná a lano
    if (TOW.tug) {
      const pr = C.proj(TOW.x, TOW.y, TOW.alt);
      if (pr && pr[2] > 10) {
        drawPlane(pr[0], pr[1], TOW.psi - S.psi + Math.PI / 2, 0, 0, 'tug', (C.f / pr[2]) / SPR * 0.9);
        if (TOW.on) {
          ctx.strokeStyle = 'rgba(40,40,45,0.8)'; ctx.lineWidth = 1.4;
          ctx.beginPath(); ctx.moveTo(pr[0], pr[1] + 2); ctx.lineTo(W / 2, H * 0.66 + dispP); ctx.stroke();
        }
      }
    }
    for (const q of spray) {
      const pr = C.proj(q.x, q.y, q.alt);
      if (!pr) continue;
      const a = clamp(1 - q.t / 7, 0, 1) * 0.5;
      ctx.fillStyle = `rgba(238,250,255,${a})`;
      ctx.beginPath(); ctx.arc(pr[0], pr[1], Math.max(0.7, C.f * q.r * M * 0.5 / pr[2]), 0, Math.PI * 2); ctx.fill();
    }
  }
  // ostatní stroje v perspektivě
  if (AI.length) {
    const vis = [];
    for (const a of AI) {
      const pr = C.proj(a.x, a.y, a.alt);
      if (!pr || pr[2] < 25) continue;
      vis.push({ a, pr });
    }
    vis.sort((p, q) => q.pr[2] - p.pr[2]);
    for (const { a, pr } of vis) {
      const sc = (C.f / pr[2]) / SPR * (a.kind === 'para' ? 1.0 : 0.95);
      if (sc * SPR < 0.25) {                       // hodně daleko → jen tečka
        ctx.fillStyle = 'rgba(50,60,75,0.75)';
        ctx.beginPath(); ctx.arc(pr[0], pr[1], 1.4, 0, Math.PI * 2); ctx.fill();
        continue;
      }
      if (a.kind === 'para') {
        ctx.save(); ctx.translate(pr[0], pr[1]); ctx.scale(sc * SPR / 6.6, sc * SPR / 6.6); ctx.translate(-pr[0], -pr[1]);
        drawPara(pr[0], pr[1], a.psi - S.psi + Math.PI / 2, a.bank, 0, 0, 1, aiPal(a));
        ctx.restore();
      } else {
        drawPlane(pr[0], pr[1], a.psi - S.psi + Math.PI / 2, a.bank, a.pitch, 'glider', sc, a.col.w);
      }
    }
  }
  if (isPG()) drawCabinPG(bankP); else drawCabinGL(bankP);
}

// ===== kabina větroně: naklání se celá, včetně přístrojů =====
function drawCabinGL(bankP) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.save();
  ctx.translate(W / 2, H / 2 + dispP);
  ctx.rotate(bankP * DEG);
  ctx.translate(-W / 2, -H / 2);
  const OV = Math.hypot(W, H) * 0.75;

  // rám překrytu
  ctx.strokeStyle = 'rgba(238,240,244,0.96)'; ctx.lineWidth = 14; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-OV * 0.4, H * 0.24); ctx.quadraticCurveTo(W * 0.5, -H * 0.26, W + OV * 0.4, H * 0.24);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(220,224,230,0.94)'; ctx.lineWidth = 12;
  ctx.beginPath(); ctx.moveTo(-8, H * 0.24); ctx.lineTo(-8, H + OV); ctx.moveTo(W + 8, H * 0.24); ctx.lineTo(W + 8, H + OV); ctx.stroke();

  // podlaha / vana trupu
  const floorY = H * 0.885;
  ctx.fillStyle = '#2b3138';
  ctx.beginPath();
  ctx.moveTo(-OV, floorY); ctx.quadraticCurveTo(W * 0.5, floorY - H * 0.05, W + OV, floorY);
  ctx.lineTo(W + OV, H + OV); ctx.lineTo(-OV, H + OV); ctx.closePath(); ctx.fill();

  // nohy pilota
  const legs = (cx0, dir) => {
    ctx.save();
    ctx.translate(cx0, H * 1.0);
    ctx.rotate(dir * 0.18);
    const g = ctx.createLinearGradient(-42, 0, 42, 0);
    g.addColorStop(0, '#525b49'); g.addColorStop(0.45, '#7b866c'); g.addColorStop(1, '#555e4b');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.roundRect(-40, -H * 0.17, 80, H * 0.24, 30); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.09)';
    ctx.beginPath(); ctx.ellipse(0, -H * 0.155, 32, 18, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-14, -H * 0.16); ctx.lineTo(-10, H * 0.03); ctx.stroke();
    ctx.restore();
  };
  legs(W / 2 - 66, -1); legs(W / 2 + 66, 1);

  // knipl – vychyluje se podle řízení
  // knipl ukazuje výchylku, ne náklon – v ustálené zatáčce je ve středu
  const aile = clamp(((S.bankCmd || 0) - S.bank) / 10 + (IN.ax || 0) * 0.1, -1, 1);
  const stx = W / 2 + aile * 42;
  const sty = H * 0.90 + clamp(((S.target || 90) - 95) / 110, -1, 1) * 22;
  ctx.strokeStyle = '#1e2228'; ctx.lineWidth = 11; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(W / 2, H * 1.02); ctx.lineTo(stx, sty); ctx.stroke();
  ctx.fillStyle = '#15181d';
  ctx.beginPath(); ctx.ellipse(stx, sty - 8, 15, 22, (stx - W / 2) / 260, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#b33'; ctx.beginPath(); ctx.arc(stx - 5, sty - 14, 3.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.beginPath(); ctx.ellipse(stx - 4, sty - 12, 4, 7, 0, 0, Math.PI * 2); ctx.fill();

  // přístrojová deska
  const ub = uiBandH();
  const r = clamp(Math.min((H - ub) * 0.085, W * 0.058), 21, 58);
  const panelBot = Math.min(floorY + 8, H - ub - 8) - (ub ? 0.10 * (H - ub) : 0);
  const panelTop = Math.min(H * 0.675, panelBot - r * 2.5);
  const panelH = panelBot - panelTop;
  const gw = r * 2.15, cxg = W / 2 - r * 1.15;
  ctx.fillStyle = '#23272c';
  ctx.beginPath();
  ctx.moveTo(-OV, panelTop + H * 0.035);
  ctx.quadraticCurveTo(W * 0.5, panelTop - H * 0.025, W + OV, panelTop + H * 0.035);
  ctx.lineTo(W + OV, panelTop + panelH); ctx.lineTo(-OV, panelTop + panelH); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(140,148,158,0.55)'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-OV, panelTop + H * 0.035);
  ctx.quadraticCurveTo(W * 0.5, panelTop - H * 0.025, W + OV, panelTop + H * 0.035);
  ctx.stroke();
  const cy = panelTop + panelH / 2;
  gaugeASI(cxg - gw, cy, r, S.iasD, S.vstall || 70);
  gaugeVario(cxg, cy, r, S.varioD);
  gaugeAlt(cxg + gw, cy, r, S.altD);
  // GPS / mapa vpravo na desce
  const mapS = r * 2.2, mapX = cxg + gw * 1.7, mapY = cy - r * 1.05;
  ctx.fillStyle = '#15181c';
  ctx.beginPath(); ctx.roundRect(mapX - 7, mapY - 7, mapS + 14, mapS + 20, 9); ctx.fill();
  ctx.strokeStyle = '#4a5058'; ctx.lineWidth = 1.5; ctx.stroke();
  drawMini(mapX, mapY, mapS);
  plainTxt('GPS', mapX + mapS / 2, mapY + mapS + 6, 9, '#8a929b', 'center', 800);

}

  const v = w.min + (clamp(x - w.sx, 0, w.sw) / w.sw) * (w.max - w.min);
  w.set(v);
}
function nearestStart(T, x, y) {
  let best = null, bd = 30;
  for (const m of markers) { const d = Math.hypot(m.x - x, m.y - y); if (d < bd) { bd = d; best = m; } }
  return best;
}
function tryStart() {
  if (TASK.type !== 'free' && !TASK.tps.length) autoTask();
  if (TASK.type !== 'free' && !TASK.tps.length) { setupMsg = 'Trať se nepovedlo sestavit – zkus jinou délku.'; return; }
  resetFlight();
  camInit = false;
  state = 'pretiles';
}
function toMenu() { state = 'setup'; setupMsg = ''; IN.ax = IN.ay = 0; IN.hold = false; }
function holdOn(id) { if (id === 'hold') IN.hold = true; if (id === 'dump') WATER.dumping = true; }
function holdOff(id) { if (id === 'hold') IN.hold = false; if (id === 'dump') WATER.dumping = false; }

function action(id) {
  initAudio();
  if (id && id.startsWith('fld:')) {
    const [, key, fid] = id.split(':');
    const arr = CFG[key], i = arr.indexOf(fid);
    if (i >= 0) arr.splice(i, 1); else arr.push(fid);
    saveCfg();
    return;
  }
  switch (id) {
    case 'mode_pg': if (!isPG()) { setMode('pg'); autoTask(); } break;
    case 'mode_gl': if (isPG()) { setMode('gl'); autoTask(); } break;
    case 'home_prev': shiftHome(-1); break;
    case 'home_next': shiftHome(1); break;
    case 'home_rnd': { const L = startList(); setHome(L[Math.floor(Math.random() * L.length)]); autoTask(); break; }
    case 'fields': showFields = true; break;
    case 'fields_close': showFields = false; saveCfg(); break;
    case 'task_free': TASK.type = 'free'; TASK.tps = []; computeTask(); break;
    case 'task_ret': TASK.type = 'ret'; autoTask(); break;
    case 'task_tri': TASK.type = 'tri'; autoTask(); break;
    case 'task_new': autoTask(); break;
    case 'wx_rnd': rollWeather(); break;
    case 'w0': PG.wing = 0; break;
    case 'w1': PG.wing = 1; break;
    case 'w2': PG.wing = 2; break;
    case 'start': tryStart(); break;
    case 'results': state = 'results'; break;
    case 'help': showHelp = true; break;
    case 'help_close': showHelp = false; break;
    case 'back': state = 'setup'; break;
    case 'view': if (state !== 'setup') { view = view ? 0 : 1; if (view) composeGT(true); } break;
    case 'heat': heat = !heat; break;
    case 'cont': contours = !contours; if (view) composeGT(true); break;
    case 'time': tsIdx = (tsIdx + 1) % TIME_SCALES.length; break;
    case 'map': showMap = !showMap; break;
    case 'ears': if (state === 'play' && isPG()) { S.ears = !S.ears; blip(S.ears ? 420 : 620, 0.08); msgs.push({ t: 0, txt: S.ears ? 'Uši zataženy – rychlé klesání' : 'Uši povoleny', big: false }); } break;
    case 'rel': if (TOW.on && TOW.phase > 0) releaseTow('Vypnuto ve ' + Math.round(S.alt - S.gnd) + ' m'); break;
    case 'pause': if (state === 'play' || state === 'launch' || state === 'tow') { pausedFrom = state; state = 'paused'; } else if (state === 'paused') state = pausedFrom; break;
    case 'resume': state = pausedFrom; break;
    case 'tomenu': toMenu(); break;
    case 'again': toMenu(); break;
  }
}

function ptrPos(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
function onDown(e) {
  const [x, y] = ptrPos(e);
  initAudio();
  if (state === 'setup' && !showHelp && !showFields) {
    const w = hitWidget(x, y);
    if (w) { ptrs.set(e.pointerId, { mode: 'slider', w }); applyDrag(w, x); return; }
  }
  const t = hitTap(x, y);
  if (!t) return;
  if (t.id === 'stick') { ptrs.set(e.pointerId, { mode: 'stick' }); stickActive = true; stickTo(x, y); return; }
  if (t.id === 'panel') { ptrs.set(e.pointerId, { mode: 'scroll', y0: y, s0: panelScroll, moved: 0 }); return; }
  if (t.id === 'map') { ptrs.set(e.pointerId, { mode: 'maptap', T: t.mapT, x, y, moved: 0 }); return; }
  if (t.hold) { ptrs.set(e.pointerId, { mode: 'hold', id: t.id }); holdOn(t.id); return; }
  ptrs.set(e.pointerId, { mode: 'btn', id: t.id, x, y });
}
function onMove(e) {
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  const [x, y] = ptrPos(e);
  if (p.mode === 'stick') stickTo(x, y);
  else if (p.mode === 'slider') applyDrag(p.w, x);
  else if (p.mode === 'scroll') { p.moved += Math.abs(y - p.y0); panelScroll = clamp(p.s0 + (p.y0 - y), 0, panelMax); }
  else if (p.mode === 'maptap') p.moved += Math.hypot(x - p.x, y - p.y);
  else if (p.mode === 'btn') p.moved = (p.moved || 0) + Math.hypot(x - p.x, y - p.y);
  if (e.cancelable) e.preventDefault();
}
function onUp(e) {
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  ptrs.delete(e.pointerId);
  if (p.mode === 'stick') { stickActive = false; IN.ax = 0; IN.ay = 0; }
  else if (p.mode === 'hold') holdOff(p.id);
  else if (p.mode === 'btn') { if ((p.moved || 0) < 22) action(p.id); }
  else if (p.mode === 'maptap' && p.moved < 12) {
    const m = nearestStart(p.T, p.x, p.y);
    if (m) { setHome(m.af); autoTask(); setupMsg = ''; }
    else setupMsg = isPG() ? 'Klepni přesněji na oranžový trojúhelník.' : 'Klepni přesněji na kolečko letiště.';
  }
}
cv.addEventListener('pointerdown', onDown, { passive: false });
window.addEventListener('pointermove', onMove, { passive: false });
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);
cv.addEventListener('touchstart', e => { if (e.cancelable) e.preventDefault(); }, { passive: false });
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('wheel', e => {
  if (state === 'setup') { panelScroll = clamp(panelScroll + e.deltaY * 0.6, 0, panelMax); if (e.cancelable) e.preventDefault(); }
}, { passive: false });

// ---- klávesnice (na počítači) ----
window.addEventListener('keydown', e => {
  const k = e.code;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(k)) e.preventDefault();
  initAudio();
  if (k === 'ArrowLeft') keys.L = true;
  if (k === 'ArrowRight') keys.R = true;
  if (k === 'ArrowUp') keys.Up = true;
  if (k === 'ArrowDown') keys.Down = true;
  if (k === 'Space') keys.Space = true;
  if (e.repeat) return;
  if (k === 'Space') {
    if (state === 'setup') tryStart();
    else if (state === 'results') state = 'setup';
    else if (state === 'paused') state = pausedFrom;
    else if (state === 'over' && overT > 0.8) toMenu();
    else if (state === 'tow' && TOW.on && TOW.phase > 0) action('rel');
  }
  if (k === 'KeyV') state = state === 'results' ? 'setup' : 'results';
  if (k === 'KeyQ') action('heat');
  if (k === 'KeyA') action('cont');
  if (k === 'KeyT') action('time');
  if (k === 'KeyN') miniZ = (miniZ + 1) % MINI_ZOOM.length;
  if (k === 'KeyM') muted = !muted;
  if (k === 'KeyC' && state !== 'setup') action('view');
  if (k === 'KeyB') action('ears');
  if (k === 'KeyR' && state === 'setup') rollWeather();
  if (k === 'KeyH' && state !== 'setup') hudMode = (hudMode + 1) % 3;
  if (k === 'KeyP' || k === 'Escape') action('pause');
});
window.addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft') keys.L = false;
  if (e.code === 'ArrowRight') keys.R = false;
  if (e.code === 'ArrowUp') keys.Up = false;
  if (e.code === 'ArrowDown') keys.Down = false;
  if (e.code === 'Space') keys.Space = false;
  if (e.code === 'KeyW') WATER.dumping = false;
});
window.addEventListener('keydown', e => { if (e.code === 'KeyW' && state === 'play' && !isPG()) WATER.dumping = true; });
window.addEventListener('blur', () => {
  keys.L = keys.R = keys.Up = keys.Down = keys.Space = false;
  IN.hold = false; WATER.dumping = false;
  if (state === 'play' || state === 'launch' || state === 'tow') { pausedFrom = state; state = 'paused'; }
});
window.addEventListener('orientationchange', () => setTimeout(resize, 250));

function keyInput(dtR) {
  if (stickActive) return;
  const kx = (keys.R ? 1 : 0) - (keys.L ? 1 : 0), ky = (keys.Up ? 1 : 0) - (keys.Down ? 1 : 0);
  if (kx) IN.ax = clamp(IN.ax + kx * 2.4 * dtR, -1, 1); else IN.ax += clamp(-IN.ax, -4 * dtR, 4 * dtR);
  if (ky) IN.ay = clamp(IN.ay + ky * 2.4 * dtR, -1, 1); else IN.ay += clamp(-IN.ay, -4 * dtR, 4 * dtR);
  if (keys.Space && (state === 'launch' || state === 'play')) IN.hold = true;
  else if (!ptrs.size) IN.hold = false;
}

// =======================================================================
//  SMYČKA
// =======================================================================
resize();
let last = performance.now();
function loadingScreen(label, frac) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#16324f'); g.addColorStop(1, '#0b1a2b');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const w = Math.min(340 * SC, W - 32);
  card(W / 2 - w / 2, H / 2 - 50, w, 100);
  txt(label, W / 2, H / 2 - 16, Math.min(17 * SC, w / 17), '#fff', 'center', 800);
  ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.fillRect(W / 2 - w * 0.4, H / 2 + 14, w * 0.8, 8);
  ctx.fillStyle = '#ffe45e'; ctx.fillRect(W / 2 - w * 0.4, H / 2 + 14, w * 0.8 * clamp(frac, 0, 1), 8);
}
let fpsAvg = 60;
function frame(now) {
  const dtR = Math.min(0.05, (now - last) / 1000); last = now;
  fpsAvg += (1 / Math.max(0.004, dtR) - fpsAvg) * 0.05;
  // automatické snížení kvality, když telefon nestíhá
  if (FX && fpsAvg < 38 && S.time > 4) { FX = 0; msgs.push({ t: 0, txt: 'snižuji detail kvůli plynulosti', big: false }); }
  if (state === 'loading') {
    const t0 = performance.now();
    let done = false;
    while (performance.now() - t0 < 24 && !done) done = rasterStep(6);
    loadingScreen('Připravuji mapu ČR…', rasterRow / RASTER.height);
    if (done) state = 'setup';
    requestAnimationFrame(frame); return;
  }
  if (state === 'setup') { drawSetup(-1, -1); requestAnimationFrame(frame); return; }
  if (state === 'results') { drawResults(); requestAnimationFrame(frame); return; }
  if (state === 'pretiles') {
    if (!camInit) { camX = S.x; camY = S.y; anchorY = H * 0.5; camInit = true; }
    const need = neededTiles(0);
    const ok = workTiles(30, need);
    const have = need.filter(n => tiles.has(n.k)).length;
    loadingScreen('Stavím krajinu…', have / Math.max(1, need.length));
    if (ok) state = isPG() ? 'launch' : 'tow';
    requestAnimationFrame(frame); return;
  }
  if (state === 'tow' && !TOW.on) state = 'play';
  keyInput(dtR);
  update(dtR);
  audioUpdate(dtR);
  if (view) drawCockpit(dtR); else drawScene(dtR);
  drawHUD();
  workTiles(state === 'paused' ? 12 : (view ? 9 : 6), view ? neededCockpitTiles() : neededTiles(1));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__dbg = {
  S, TOW, LNCH, TASK, WX, PG, WINGS, WATER, IN, keys, polar, polarInfo, vTrim, vTop, vStall, slopeLift,
  view: () => view, setView: v => { view = v; if (v) composeGT(true); }, terrainElev, setMode, mode: () => MODE,
  scale: () => TIME_SCALES[tsIdx], setHome, autoTask, AIRFIELDS, SITES, home: () => HOME,
  markers: () => markers, taps: () => taps, widgets: () => widgets, action, tryStart, shiftHome,
  setWind, clouds: () => clouds, state: () => state, setState: s => { state = s; }, results: () => results,
  fps: () => fpsAvg, tiles: () => tiles, QUAL, size: () => [W, H, DPR, SC],
  hit: (x, y) => ({ tap: (hitTap(x, y) || {}).id, w: !!hitWidget(x, y) }),
  lakeAt, findLaunchSpot, slopeAt, RIDGES, LAKES, CITIES, CFG, FIELDS, AI, contours: () => contours, WAVE, WCL, waveAt, waveSetup, airmassAt, aiBestCloud, spawnAI, thermK, windAt
};
})();
