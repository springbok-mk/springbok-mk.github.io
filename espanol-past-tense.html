<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Español: past tense para checos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;1,400;1,700&family=Alegreya+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>:root{
  --bg:#EEF2FA; --surface:#FFFFFF; --surface2:#E4EAF7; --ink:#12203F; --muted:#56638A; --line:#CBD5EA;
  --cobalt:#1E44B5; --cobalt-deep:#142E80; --pale:#A9BDF2; --saffron:#E9A20F; --on-cobalt:#FFFFFF;
  --ok:#1F7A4C; --ok-bg:#E1F3E8; --bad:#C2341F; --bad-bg:#FBE6E2; --warn:#8A5A00; --warn-bg:#FCF0D2;
  --es:'Alegreya', Georgia, 'Times New Roman', serif; --ui:'Alegreya Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --nav-h:62px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1230; --surface:#141E47; --surface2:#1C2960; --ink:#EAF0FF; --muted:#9CABD6; --line:#2A3A78;
    --cobalt:#7C99FF; --cobalt-deep:#AFC1FF; --pale:#3A4FA3; --saffron:#F5B93A; --on-cobalt:#0B1230;
    --ok:#6BD39A; --ok-bg:#12382A; --bad:#FF8A76; --bad-bg:#43191A; --warn:#F5C970; --warn-bg:#3B2F12;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1230; --surface:#141E47; --surface2:#1C2960; --ink:#EAF0FF; --muted:#9CABD6; --line:#2A3A78;
  --cobalt:#7C99FF; --cobalt-deep:#AFC1FF; --pale:#3A4FA3; --saffron:#F5B93A; --on-cobalt:#0B1230;
  --ok:#6BD39A; --ok-bg:#12382A; --bad:#FF8A76; --bad-bg:#43191A; --warn:#F5C970; --warn-bg:#3B2F12;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.45;min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,summary:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
h1,h2,h3{font-family:var(--es);font-weight:700;margin:0;line-height:1.15}
.es{font-family:var(--es)}
.muted{color:var(--muted)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom))}
.screen[hidden]{display:none}

/* azulejo strip: the one decorative element */
.strip{height:22px;background-color:var(--cobalt);
  background-image:radial-gradient(circle at 0 0,var(--bg) 0 7px,transparent 7.5px),radial-gradient(circle at 22px 0,var(--bg) 0 7px,transparent 7.5px),radial-gradient(circle at 0 22px,var(--bg) 0 7px,transparent 7.5px),radial-gradient(circle at 22px 22px,var(--bg) 0 7px,transparent 7.5px),radial-gradient(circle at 11px 11px,var(--saffron) 0 3px,transparent 3.5px);
  background-size:22px 22px}
.masthead{padding:18px 0 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.masthead h1{font-size:34px;letter-spacing:-.01em;font-style:italic}
.masthead p{margin:2px 0 0;color:var(--muted);font-size:15px}
.streak{text-align:right;font-size:14px;color:var(--muted);white-space:nowrap}
.streak b{display:block;font-family:var(--es);font-size:26px;color:var(--ink);line-height:1}

.today{margin:14px 0 18px}
.today .row{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:6px}
.bar{height:8px;background:var(--surface2);border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--cobalt);width:0;transition:width .35s ease}
.bar.gold>i{background:var(--saffron)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:12px 18px;border-radius:12px;font-weight:700;font-size:18px;text-align:center}
.btn.primary{background:var(--cobalt);color:var(--on-cobalt)}
.btn.primary:active{background:var(--cobalt-deep)}
.btn.ghost{background:var(--surface);border:1.5px solid var(--line)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn small{display:block;font-weight:400;font-size:14px;opacity:.85}
.btn .stack{display:block}
.btn:disabled{opacity:.45;cursor:default}
.cta-row{display:grid;gap:10px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin:22px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:15px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.group{margin-top:26px}
.group h2{font-size:22px;margin-bottom:2px}
.group>p{margin:0 0 10px;color:var(--muted);font-size:15px}
.deck{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px 12px;margin-bottom:8px}
.deck:active{border-color:var(--cobalt)}
.deck .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.deck .name{font-weight:700}
.deck .ex{font-family:var(--es);font-style:italic;color:var(--muted);font-size:16px;margin:1px 0 9px}
.deck .meta{font-size:13px;color:var(--muted);white-space:nowrap}
.badge{display:inline-block;background:var(--saffron);color:#12203F;border-radius:999px;padding:1px 8px;font-size:12.5px;font-weight:700;margin-left:6px}
.badge.red{background:var(--bad);color:#fff}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1.5px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.tabs .in{display:flex;width:100%;max-width:640px}
nav.tabs button{flex:1;height:var(--nav-h);font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--cobalt);font-weight:700}
body.in-session nav.tabs{display:none}
body.in-session .wrap{padding-bottom:24px}

/* session */
.s-head{display:flex;align-items:center;gap:12px;padding:12px 0 10px;position:sticky;top:0;background:var(--bg);z-index:5}
.s-head .x{width:40px;height:40px;border-radius:10px;font-size:22px;color:var(--muted);flex:none}
.s-head .bar{flex:1}
.s-head .count{font-size:14px;color:var(--muted);min-width:48px;text-align:right;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:18px 16px 16px;margin-top:6px}
.tense{font-size:14.5px;color:var(--cobalt);font-weight:700}
.tense span{color:var(--muted);font-weight:400}
.retry-tag{float:right;margin-left:10px;font-size:13px;color:var(--bad);font-weight:700}
.inf{font-family:var(--es);font-size:40px;font-weight:700;line-height:1.05;margin:10px 0 2px;word-break:break-word}
.cz{color:var(--muted);font-size:16px}
.who{display:inline-block;margin-top:14px;font-family:var(--es);font-size:21px;font-style:italic;border-bottom:3px solid var(--saffron);padding-bottom:1px}
.sentence{font-family:var(--es);font-size:26px;line-height:1.3;margin:12px 0 6px}
.sentence .gap{display:inline-block;min-width:74px;border-bottom:3px solid var(--cobalt);text-align:center;color:var(--cobalt);font-weight:700;padding:0 4px}
.sentence .gap.ok{color:var(--ok);border-color:var(--ok)}
.sentence .gap.shown{color:var(--ink);border-color:var(--saffron)}
.hintline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.pill{font-family:var(--es);font-size:17px;padding:3px 10px;border-radius:8px;background:var(--surface2)}
.pill.person{font-style:italic}

.answer{margin-top:16px}
.typed{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--ink);border-radius:12px;padding:0 12px;min-height:58px}
.typed .pre{font-family:var(--es);font-size:24px;color:var(--muted);white-space:nowrap}
.typed input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font-family:var(--es);font-size:24px;padding:12px 0;outline:none}
.typed.ok{border-color:var(--ok);background:var(--ok-bg)}
.typed.bad{border-color:var(--bad);background:var(--bad-bg)}
.accents{display:flex;gap:6px;margin-top:8px}
.accents button{flex:1;height:44px;border-radius:9px;background:var(--surface2);font-family:var(--es);font-size:21px}
.accents button:active{background:var(--pale)}
.actions{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:10px}
.opts{display:grid;gap:9px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-family:var(--es);font-size:23px;min-height:58px}
.opt kbd{font-family:var(--ui);font-size:13px;color:var(--muted);border:1.5px solid var(--line);border-radius:6px;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.opt:active{border-color:var(--cobalt)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default;opacity:1}
.opt.dim{opacity:.5}
.linkbtn{color:var(--muted);text-decoration:underline;font-size:15px;padding:10px 4px}

.fb{margin-top:14px;border-radius:14px;padding:14px 14px 12px;border-left:6px solid var(--ok);background:var(--ok-bg)}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb.warn{border-color:var(--saffron);background:var(--warn-bg)}
.fb .verdict{font-weight:700;color:var(--ok)}
.fb.bad .verdict{color:var(--bad)}
.fb.warn .verdict{color:var(--warn)}
.fb .right{font-family:var(--es);font-size:28px;font-weight:700;margin:2px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fb .yours{font-size:15px}
.fb .yours s{font-family:var(--es);font-size:18px}
.fb .full{font-family:var(--es);font-size:19px;margin-top:6px}
.fb .full b{color:var(--cobalt-deep)}
.fb .note{margin-top:8px;font-size:15.5px}
.say{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex:none}
.say svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
details.conj{margin-top:10px;font-size:15px}
details.conj summary{cursor:pointer;color:var(--muted);padding:6px 0}
table.ct{border-collapse:collapse;width:100%;margin-top:4px}
table.ct td{padding:3px 0;border-bottom:1px solid var(--line);vertical-align:baseline}
table.ct td:first-child{color:var(--muted);font-size:14px;width:40%}
table.ct td:last-child{font-family:var(--es);font-size:18px}
table.ct tr.me td:last-child{font-weight:700;color:var(--cobalt-deep)}
table.ct .irr{color:var(--bad)}
.next{margin-top:12px}

/* summary */
.sum h2{font-size:30px;margin:26px 0 4px}
.score{font-family:var(--es);font-size:64px;font-weight:700;line-height:1;margin:14px 0 2px}
.score small{font-size:22px;color:var(--muted);font-weight:400}
.miss{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.miss .f{font-family:var(--es);font-size:20px;font-weight:700}
.miss .w{font-size:14.5px;color:var(--muted)}

/* mosaic */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--muted);margin:10px 0 4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:0 100% 0 100%;margin-right:5px;vertical-align:-1px}
.bandtitle{font-size:14px;color:var(--muted);margin:18px 0 6px;display:flex;justify-content:space-between}
.mosaic{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px}
.tile{aspect-ratio:1;background:var(--surface);border:1px solid var(--line);border-radius:2px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;padding:2px;gap:1px;position:relative}
.tile i{display:block;background:var(--line)}
.tile i:nth-child(1),.tile i:nth-child(4){border-radius:0 100% 0 100%}
.tile i:nth-child(2),.tile i:nth-child(3){border-radius:100% 0 100% 0}
.q1{background:var(--pale)!important}.q2{background:var(--cobalt)!important}.q3{background:var(--saffron)!important}.qx{background:var(--bad)!important}
.keybox{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-top:12px;font-size:14.5px}
.keybox .tile{width:64px}
.keybox ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 6px}
.stat{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--es);font-size:28px;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.hard{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 2px;border-bottom:1px solid var(--line);text-align:left}
.hard .v{font-family:var(--es);font-size:20px;font-weight:700}
.hard .n{font-size:14px;color:var(--bad)}
.search{width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:17px;margin-top:16px}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(8,14,40,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88dvh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet h2{font-size:34px}
.sheet h3{font-size:17px;font-family:var(--ui);margin:16px 0 2px;color:var(--cobalt)}
.sheet .closer{float:right;width:40px;height:40px;font-size:24px;color:var(--muted)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
table.ct td:first-child{width:44%}

/* cheat sheet + settings */
.doc h2{font-size:30px;margin:22px 0 6px}
.doc details{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;margin-bottom:8px;padding:0 14px}
.doc summary{font-weight:700;padding:14px 0;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
.doc summary::-webkit-details-marker{display:none}
.doc summary::after{content:'+';color:var(--muted);font-weight:400;font-size:22px;line-height:1}
.doc details[open] summary::after{content:'–'}
.doc .body{padding:0 0 14px;font-size:16px}
.doc .body p{margin:0 0 10px}
.doc .body .es{font-size:18px}
.doc .tbl{overflow-x:auto}
.doc table{border-collapse:collapse;width:100%;font-size:15.5px}
.doc th{text-align:left;font-weight:700;color:var(--muted);font-size:13.5px;padding:4px 8px 4px 0;border-bottom:1.5px solid var(--line)}
.doc td{padding:5px 8px 5px 0;border-bottom:1px solid var(--line);vertical-align:top}
.doc td.es{font-size:17.5px}
.doc .no{color:var(--bad);text-decoration:line-through}
.set{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:4px 14px;margin-bottom:12px}
.set .line{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.set .line:last-child{border-bottom:0}
.set .line small{display:block;color:var(--muted);font-size:14px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{padding:8px 12px;font-size:15px;min-width:44px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.switch{position:relative;width:52px;height:32px;border-radius:16px;background:var(--line);flex:none;transition:background .15s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .15s}
.switch[aria-checked="true"]{background:var(--cobalt)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
textarea.code{width:100%;min-height:90px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:13px/1.3 ui-monospace,Menlo,Consolas,monospace;padding:10px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;z-index:60;max-width:90vw;text-align:center}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted);text-align:center;margin-top:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:700px){.inf{font-size:48px}.sentence{font-size:30px}.opts{grid-template-columns:1fr 1fr}}

/* v2 */
nav.tabs button{font-size:12.5px}
.lvl{margin-top:30px;background:var(--surface2);border-radius:14px;padding:14px}
.lvl-t{font-weight:700;margin-bottom:8px}
.lvl p{margin:10px 0 0;font-size:15px;color:var(--muted)}
.seg.wide{display:flex;width:100%;background:var(--surface)}
.seg.wide button{flex:1;padding:11px 6px;font-size:14.5px;line-height:1.2}
.sentence.czbig{font-family:var(--ui);font-size:23px;font-weight:700;line-height:1.3}
.hintrow{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:4px}
.typed input{font-size:22px}
u.lack{text-decoration:underline;text-decoration-color:var(--saffron);text-decoration-thickness:3px;text-underline-offset:3px}
.claude-out{margin-top:8px;font-size:15.5px;background:var(--surface);border-radius:10px;padding:10px 12px;white-space:pre-wrap}
.btn.small{min-height:46px;font-size:16px;margin-top:6px}
.gram .lead{font-size:18px;margin:0 0 6px}
.gram section{margin-top:30px;scroll-margin-top:12px}
.gram h3{font-size:24px;margin-bottom:8px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.gram h3 .es{font-style:italic;font-weight:400;color:var(--cobalt);font-size:21px}
.gram p{margin:10px 0 6px}
.gram .es{font-size:18px}
.exm{border-left:4px solid var(--saffron);padding:4px 0 4px 12px;margin:6px 0 12px}
.exm .es{font-size:19.5px;line-height:1.3}
.exm .es b,.gram td.es b,.steps .es b{color:var(--cobalt-deep)}
.exm .cz{font-size:15px}
.gram .warn,.gram .tip{background:var(--warn-bg);border-radius:10px;padding:10px 12px;font-size:15.5px}
.gram .tip{background:var(--surface2)}
.steps{margin:0;padding-left:22px}
.steps li{margin-bottom:10px}
.toc{margin:14px 0 6px}
.tl{width:100%;height:auto;margin:8px 0 0;background:var(--surface);border:1.5px solid var(--line);border-radius:14px}
.tl-es{font-family:var(--es);font-style:italic;font-size:14px;fill:var(--ink)}
.tl-cz{font-family:var(--ui);font-size:10.5px;fill:var(--muted)}

/* web build: navigation on top (free hosting floats an ad over the bottom edge) */
body.nav-top{padding-top:calc(var(--nav-h) + env(safe-area-inset-top))}
body.nav-top.in-session{padding-top:0}
body.nav-top nav.tabs{top:0;bottom:auto;border-top:0;border-bottom:1.5px solid var(--line);padding-bottom:0;padding-top:env(safe-area-inset-top)}
body.nav-top .wrap{padding-bottom:40px}
body.nav-top .toast{bottom:24px}
body.nav-top .gram section{scroll-margin-top:calc(var(--nav-h) + 12px)}
</style>
</head>
<body>
<div class="strip" aria-hidden="true"></div>
<main>
  <div class="screen" id="s-home"><div class="wrap"></div></div>
  <div class="screen" id="s-session" hidden><div class="wrap"></div></div>
  <div class="screen" id="s-summary" hidden><div class="wrap"></div></div>

  <section id="g-pairs"><h3>Co se nejvíc plete</h3>

  const kind = res.ok ? (res.accent ? 'warn' : '') : (res.accent ? 'warn bad' : 'bad');
  const model = c.es ? filled(c) : '';
  const verdict = res.dunno ? 'Správná odpověď' : (c.level2 && res.ok && !res.accent) ? (res.full ? 'Správně, celá věta sedí' : 'Sloveso správně. Zbytek věty porovnej se vzorem') : res.ok ? (res.accent ? 'Uznáno, ale pozor na čárku' : ['Správně', 'Přesně tak', 'Sedí'][Math.floor(Math.random() * 3)]) : (res.accent ? 'Skoro – chybí nebo přebývá čárka' : 'Špatně');

  if (c.level2) {

    const parts = c.es.split('___').map(seg => seg.split(/(\s+)/).map(w => { const n = E.deaccent(norm(w)); return (!n || mine.has(n) || res.full || !input || !res.ok) ? esc(w) : `<u class="lack">${esc(w)}</u>`; }).join(''));
    h += `<div class="full">${parts[0]}<b>${esc(capIf(c, c.correct))}</b>${parts[1] || ''}</div>`;
    if (input && !res.full) h += `<div class="yours">Tvoje věta: <span class="es" style="font-size:18px">${esc(input)}</span></div>` + (res.ok ? '<div class="yours muted">Podtržená slova ve vzoru ve tvé větě chybí nebo jsou jinak.</div>' : '');
  }
  if (c.answers.length > 1) h += `<div class="yours">Správně je i: <span class="es">${c.answers.slice(1).map(esc).join(', ')}</span></div>`;
  if (!res.ok && input && !c.level2) h += `<div class="yours">Tvoje odpověď: <s>${esc(input)}</s></div>`;
  h += `<div class="note">${esc(noteFor(c))}</div>`;
  if (c.tense !== 'pp') {
    const v = c.v.inf, irrP = E.irregularPersons(v, c.tense);
    h += `<details class="conj"><summary>Celé časování: ${esc(v)}, ${TENSE[c.tense][0].toLowerCase()}</summary><table class="ct">` + [0, 1, 2, 3, 4, 5].filter(p => (p !== 4 || S.set.vos)).map(p => `<tr class="${p === c.person ? 'me' : ''}"><td>${PRON_S[p]}</td><td class="${irrP.includes(p) && c.tense !== 'pf' && c.tense !== 'pq' ? 'irr' : ''}">${esc((E.isRefl(v) ? E.REFL[p] + ' ' : '') + E.form(v, c.tense, p))}</td></tr>`).join('') + '</table></details>';
  }
  if (c.level2 && input && !res.full && sampleFn) h += `<button class="chip" data-act="ask-claude" style="margin-top:10px">Zhodnotit můj překlad s Claudem</button><div class="claude-out" id="claudeout" hidden></div>`;
  session.lastInput = input || '';
  h += `</div><button class="btn primary next" data-act="next" id="nextbtn">${session.queue.length ? 'Další' : 'Dokončit'}</button>`;
  $('#fb').innerHTML = h;

  const nb = $('#nextbtn'); if (c.mode === 'mc' || !('ontouchstart' in window)) nb.focus({ preventScroll: true });

/* ===== mosaic ===== */
function qLevel(keys) {
  const seen = keys.filter(isSeen); if (!seen.length) return '';
  if (seen.some(isMistake)) return 'qx';
  const b = Math.min(...seen.map(k => st(k)[0])); return b >= 5 ? 'q3' : b >= 3 ? 'q2' : 'q1';
}
function tileHTML(v) {
  const q = [qLevel(['pp:' + v.inf, 'pf:' + v.inf, 'pq:' + v.inf]), qLevel(['in:' + v.inf]), qLevel(['im:' + v.inf]), qLevel(['sp:' + v.inf, 'si:' + v.inf, 'sq:' + v.inf, 'sx:' + v.inf])];
  return `<button class="tile" data-verb="${esc(v.inf)}" title="${esc(v.inf)}" aria-label="${esc(v.inf)}">${q.map(x => `<i class="${x}"></i>`).join('')}</button>`;
}
function renderMosaic() {
  const keys = Object.keys(S.items); const known = keys.filter(isKnown).length;
  const total = [...new Set(DECKS.map(d => d.cat))].reduce((n, c) => { const b = S.set.band; S.set.band = 0; const l = catPool(c).length; S.set.band = b; return n + l; }, 0);
  const hard = {}; keys.forEach(k => { const s = S.items[k]; const id = k.slice(k.indexOf(':') + 1); if (s[2] > 0 && VMAP[id]) hard[id] = (hard[id] || 0) + s[2]; });
  const hardest = Object.entries(hard).sort((a, b) => b[1] - a[1]).slice(0, 8);
  let h = `<div class="doc"><h2>Mozaika</h2></div><p class="muted" style="margin:0">Každá dlaždice je jedno sloveso. Čtyři lístky se vybarvují podle toho, co z něj umíš. Klepni na dlaždici a uvidíš celé časování.</p>
  <div class="stats"><div class="stat"><b>${known}</b><span>položek umíš</span></div><div class="stat"><b>${keys.length}</b><span>už jsi viděl</span></div><div class="stat"><b>${total}</b><span>celkem v aplikaci</span></div></div>
  <div class="keybox"><div class="tile" aria-hidden="true"><i class="q2"></i><i class="q1"></i><i class="q3"></i><i class="qx"></i></div><ul><li>↖ příčestí a složené časy</li><li>↗ indefinido</li><li>↙ imperfecto</li><li>↘ věty</li></ul></div>
  <p class="muted" style="font-size:14px;margin:8px 0 0">„Umíš“ v řádku u pásma = příčestí i indefinido daného slovesa.</p><div class="legend"><span><i style="background:var(--line)"></i>neviděno</span><span><i style="background:var(--pale)"></i>učím se</span><span><i style="background:var(--cobalt)"></i>umím</span><span><i style="background:var(--saffron)"></i>umím dlouhodobě</span><span><i style="background:var(--bad)"></i>chyba k opravě</span></div>
  <input class="search" id="vsearch" type="search" placeholder="Najdi sloveso (španělsky nebo česky)" autocomplete="off" autocapitalize="none" spellcheck="false"><div id="vresults"></div>`;
  const cuts = [[0, 50, 'Top 50'], [50, 100, '51–100'], [100, 200, '101–200'], [200, 300, '201–300'], [300, VERBS.length, '301–' + VERBS.length]];
  for (const [a, b, l] of cuts) { const vs = VERBS.slice(a, b); const done = vs.filter(v => qLevel(['pp:' + v.inf]).match(/q[23]/) && qLevel(['in:' + v.inf]).match(/q[23]/)).length; h += `<div class="bandtitle"><span>${l}</span><span>${done} / ${vs.length} umíš</span></div><div class="mosaic">${vs.map(tileHTML).join('')}</div>`; }
  if (hardest.length) h += `<div class="group"><h2>Tvoje nejtěžší slovesa</h2><p>Podle počtu chyb. Klepnutím spustíš trénink jen na to sloveso.</p>${hardest.map(([inf, n]) => `<button class="hard" data-drill="${esc(inf)}"><span><span class="v">${esc(inf)}</span> <span class="muted">${esc(VMAP[inf].cz)}</span></span><span class="n">${n}× špatně</span></button>`).join('')}</div>`;

function conjTable(inf, t) { const irr = E.irregularPersons(inf, t); return '<table class="ct">' + [0, 1, 2, 3, 4, 5].map(p => `<tr><td>${PRON_S[p]}</td><td class="${irr.includes(p) && t !== 'pf' && t !== 'pq' ? 'irr' : ''}">${esc((E.isRefl(inf) ? E.REFL[p] + ' ' : '') + E.form(inf, t, p))}</td></tr>`).join('') + '</table>'; }

  <div class="set"><div class="line"><div>Přísně na čárky<small>hablo × habló je jiný tvar. Když vypneš, chybná čárka se uzná s upozorněním.</small></div>${sw('strict')}</div>
  <div class="line"><div>Zkoušet i vosotros<small>Vypni, pokud se učíš latinskoamerickou španělštinu.</small></div>${sw('vos')}</div>
  ${canSpeak() ? `<div class="line"><div>Po odpovědi přečíst nahlas<small>Použije španělský hlas tvého zařízení.</small></div>${sw('tts')}</div>` : ''}</div>
  <div class="set"><div class="line"><div>Synchronizace mezi zařízeními<small id="syncinfo">${esc(Sync.label())}</small></div><button class="chip" data-act="syncnow">Synchronizovat</button></div>
  <div class="line" style="display:block"><div>Záloha a přenos postupu<small>Zkopíruj kód a vlož ho na jiném zařízení. Při vložení se postup sloučí, nic se neztratí.</small></div>
  <textarea class="code" id="code" placeholder="Sem vlož kód se zálohou" spellcheck="false"></textarea><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px"><button class="chip" data-act="export">Vytvořit a zkopírovat kód</button><button class="chip" data-act="import">Načíst vložený kód</button></div></div></div>
  <button class="btn danger" data-act="reset">Smazat veškerý postup</button><p class="muted" style="font-size:14px;margin-top:14px">Pořadí sloves vychází z frekvence v korpusu filmových titulků (OpenSubtitles) a je ručně upravené. Tvary jsou ověřené proti databázi časování Freda Jehleho; pravopis podle RAE 2010 (rio, hui, guion), starší varianty s čárkou aplikace uzná.</p>`;
}

/* ===== optional: let Claude judge a free translation ===== */
let sampleFn = null;
async function askClaude(btn) {
  const c = session.card, out = $('#claudeout'); if (!sampleFn || !out) return;
  btn.disabled = true; out.hidden = false; out.textContent = 'Přemýšlím…';
  const prompt = 'Jsi učitel španělštiny (norma Španělska) a tvůj student je Čech, který trénuje minulé časy.\n\nČeská věta: ' + c.czs + '\nVzorový překlad: ' + filled(c) + '\nStudentův překlad: ' + session.lastInput +
    '\n\nOdpověz česky, nejvýše třemi krátkými větami, bez úvodu a bez formátování: Je studentův překlad gramaticky správně a znamená totéž? Pokud ne, jmenuj konkrétní chyby. Pokud použil jiný minulý čas nebo jiné sloveso než vzor, řekni, jestli je to také přijatelné.';
  try { await sampleFn(prompt, { modelTier: 'quick', onText: ({ text }) => { out.textContent = text; } }); btn.remove(); }
  catch (e) { out.textContent = e && e.code === 'not_granted' ? 'Bez tvého svolení se Claude zeptat nemůžu.' : e && e.code === 'rate_limited' ? 'Teď je to moc dotazů najednou, zkus to za chvíli.' : 'Hodnocení se teď nepodařilo načíst.'; if (!(e && e.code === 'not_granted')) btn.disabled = false; else btn.remove(); }
  const nb = $('#nextbtn'); if (nb) nb.scrollIntoView({ block: 'nearest' });
}

/* ===== merge / sync ===== */
function mergeItems(remote) { let changed = false; for (const k in remote) { const r = remote[k], l = S.items[k]; if (Array.isArray(r) && (!l || (r[4] || 0) > (l[4] || 0))) { S.items[k] = r; changed = true; } } return changed; }
function mergeDays(remote) { for (const d in remote || {}) { const r = remote[d], l = S.days[d]; if (!l || r[0] > l[0]) S.days[d] = r; } }
const Sync = (() => {
  let db = null, uid = null, state = 'off', last = 0, busy = false, again = false;
  const cats = [...new Set(DECKS.map(d => d.cat))];
  const ref = id => db.doc('data/users/' + uid + '/' + id);
  function label() { return state === 'ok' ? 'Zapnuto. Postup se ukládá k tvému účtu' + (last ? ', naposledy v ' + new Date(last).toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' }) : '') + '.' : state === 'sync' ? 'Probíhá…' : state === 'err' ? 'Teď se nepodařilo spojit. Postup je uložený v tomto prohlížeči a zkusím to znovu.' : 'Nedostupná v tomto zobrazení. Postup se ukládá v tomto prohlížeči; pro přenos použij kód níže.'; }
  function setState(s) { state = s; const el = document.getElementById('syncinfo'); if (el) el.textContent = label(); }
  async function init() {
    try {
      if (!window.claude || !window.claude.use) return;
      const [d, u] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!d || !u) return; const id = await u.id(); if (!id) return; db = d; uid = id; await pull();
    } catch (e) { setState(db ? 'err' : 'off'); }
  }
  async function pull() {
    setState('sync');
    try {
      const snaps = await Promise.all(['meta', ...cats].map(c => ref(c).get().then(s => [c, s])));
      for (const [c, s] of snaps) {
        if (!s.exists) { if (c === 'meta' ? Object.keys(S.days).length : Object.keys(S.items).some(k => k.startsWith(c + ':'))) dirty.add(c); continue; }
        const data = s.data() || {};
        if (c === 'meta') { mergeDays(data.days); if (data.set && (data.set.ts || 0) > (S.set.ts || 0)) S.set = { ...DEF_SET, ...data.set }; else if ((S.set.ts || 0) > ((data.set || {}).ts || 0)) dirty.add('meta'); }
        else { const remote = data.items || {}; mergeItems(remote); for (const k in S.items) if (k.startsWith(c + ':') && (!remote[k] || (S.items[k][4] || 0) > (remote[k][4] || 0))) { dirty.add(c); break; } }
      }
      saveLocal(); last = Date.now(); setState('ok'); if (screen === 'home') renderHome(); if (screen === 'mosaic') renderMosaic();
      if (dirty.size) push();
    } catch (e) { setState('err'); }
  }
  async function push() {
    if (!db) return; if (busy) { again = true; return; } busy = true; setState('sync');
    try {
      for (const c of [...dirty]) {
        dirty.delete(c);
        try {
          if (c === 'meta') { const days = {}; Object.keys(S.days).sort().slice(-120).forEach(d => days[d] = S.days[d]); await ref('meta').set({ days, set: S.set }); }
          else { const items = {}; for (const k in S.items) if (k.startsWith(c + ':')) items[k] = S.items[k]; await ref(c).set({ items }); }
        } catch (e) { dirty.add(c); throw e; }
      }
      last = Date.now(); setState('ok');
    } catch (e) { setState('err'); }
    busy = false; if (again) { again = false; push(); }
  }
  return { init, pull, push, label, available: () => !!db };
})();

/* ===== events ===== */
function setSetting(key, val) { S.set[key] = val; S.set.ts = Date.now(); dirty.add('meta'); saveLocal(); }
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-act]'); if (!t) { if (e.target.id === 'sheet-bg') $('#sheet-bg').hidden = true; return; }
  const d = t.dataset;
  if (d.go) return show(d.go);
  if (d.band != null) { setSetting('band', +d.band); return renderHome(); }
  if (d.deck) { const deck = DMAP[d.deck]; return startSession(deck.name, buildFromPool(deckPool(deck), S.set.len), { again: () => buildFromPool(deckPool(deck), S.set.len) }); }
  if (d.verb) return openVerb(d.verb);
  if (d.drill) { $('#sheet-bg').hidden = true; return startSession('Sloveso ' + d.drill, buildVerb(d.drill)); }
  if (d.opt != null) return answer(session.card.options[+d.opt], +d.opt);
  if (d.say) return speak(d.say);
  if (d.acc) { const inp = $('#inp'); if (!inp || session.answered) return; const s = inp.selectionStart ?? inp.value.length, en = inp.selectionEnd ?? s; inp.value = inp.value.slice(0, s) + d.acc + inp.value.slice(en); inp.focus(); inp.setSelectionRange(s + 1, s + 1); return; }
  if (d.set) { const v = isNaN(+d.val) ? d.val : +d.val; setSetting(d.set, v); return screen === 'home' ? renderHome() : renderSettings(); }
  if (d.toggle) { setSetting(d.toggle, !S.set[d.toggle]); return renderSettings(); }
  switch (d.act) {
    case 'daily': return startSession('Denní trénink', buildDaily(S.set.len), { again: () => buildDaily(S.set.len) });
    case 'mistakes': return startSession('Oprava chyb', buildMistakes(Math.max(S.set.len, 10)));
    case 'submit': { const v = $('#inp').value; if (!v.trim()) { $('#inp').focus(); return toast('Napiš tvar, nebo zvol „Nevím“.'); } return answer(v); }
    case 'dunno': return answer(null);
    case 'hint-verb': session.card.hintVerb = true; $('#hints').innerHTML = hintPills(session.card); t.remove(); $('#inp').focus(); return;
    case 'hint-cloze': { const c = session.card; c.level2 = false; c.mode = 'type'; return renderCard(); }
    case 'ask-claude': return askClaude(t);
    case 'next': return nextCard();
    case 'quit': if (!session || !session.done || confirm('Ukončit trénink? Odpovědi, které už máš, zůstanou uložené.')) { Sync.push(); show('home'); } return;
    case 'home': return show('home');
    case 'redo': return startSession('Oprava chyb z tréninku', session.misses.map(m => m.raw));
    case 'more': return session.again ? startSession(session.title, session.again(), { again: session.again }) : show('home');
    case 'close-sheet': $('#sheet-bg').hidden = true; return;
    case 'syncnow': if (!Sync.available()) return toast('Synchronizace tady není dostupná. Použij kód se zálohou.'); return Sync.pull().then(() => toast('Synchronizováno'));
    case 'export': { const code = btoa(unescape(encodeURIComponent(JSON.stringify({ items: S.items, days: S.days })))); $('#code').value = code; $('#code').select(); (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).then(() => toast('Kód je ve schránce'), () => toast('Kód je připravený, zkopíruj ho ručně')); return; }
    case 'import': { try { const data = JSON.parse(decodeURIComponent(escape(atob($('#code').value.trim())))); if (!data.items) throw 0; mergeItems(data.items); mergeDays(data.days); Object.keys(data.items).forEach(k => dirty.add(k.split(':')[0])); dirty.add('meta'); saveLocal(); Sync.push(); toast('Postup načten a sloučen'); } catch (err) { toast('Tenhle kód se nepodařilo přečíst. Zkopíruj ho znovu celý.'); } return; }
    case 'reset': if (confirm('Opravdu smazat veškerý postup? Tohle nejde vrátit.')) { Object.keys(S.items).forEach(k => dirty.add(k.split(':')[0])); S.items = {}; S.days = {}; dirty.add('meta'); saveLocal(); Sync.push(); toast('Postup smazán'); renderSettings(); } return;
  }
});
document.addEventListener('pointerdown', e => { if (e.target.closest('[data-acc]')) e.preventDefault(); });
document.addEventListener('keydown', e => {
  if (screen !== 'session' || !session) return;
  if (e.key === 'Enter') { e.preventDefault(); if (session.answered) return nextCard(); const inp = $('#inp'); if (inp) { if (inp.value.trim()) answer(inp.value); } return; }
  if (!session.answered && session.card.mode === 'mc' && /^[1-4]$/.test(e.key)) { const i = +e.key - 1; if (session.card.options[i]) answer(session.card.options[i], i); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'inp' && session && session.answered) { e.target.value = e.target.dataset.locked ?? e.target.value; }
  if (e.target.id === 'vsearch') { const q = E.deaccent(e.target.value.trim().toLowerCase()); const deCz = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); const res = q.length < 2 ? [] : VERBS.filter(v => E.deaccent(v.inf).startsWith(q) || deCz(v.cz).includes(deCz(q))).slice(0, 8); $('#vresults').innerHTML = res.map(v => `<button class="hard" data-verb="${esc(v.inf)}"><span><span class="v">${esc(v.inf)}</span> <span class="muted">${esc(v.cz)}</span></span><span class="muted" style="font-size:14px">#${v.rank + 1}</span></button>`).join('') + (q.length >= 2 && !res.length ? '<div class="empty">Tohle sloveso v seznamu není.</div>' : ''); }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { } Sync.push(); } });

/* ===== boot ===== */
if (HUB_LINK) document.body.classList.add('nav-top');
loadLocal(); if (canSpeak()) { initVoices(); try { speechSynthesis.onvoiceschanged = initVoices; } catch (e) { } }
show('home'); Sync.init();
try { if (window.claude && window.claude.use) window.claude.use('sample').then(f => { sampleFn = f || null; }); } catch (e) { }

if (/[?&]dyhtest/.test(location.search)) { const g = { session: () => session, S: () => S, filled: () => filled, isMistake: () => isMistake, dayKey: () => dayKey, LS_KEY: () => LS_KEY }; for (const k in g) Object.defineProperty(window, k, { get: g[k], configurable: true }); }
})();
</script>
</body>
</html>
